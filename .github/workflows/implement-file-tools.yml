name: Implement file tools once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          # Use one canonical Documents directory on the macOS host.
          path = Path("session-control.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              'DOCUMENTS_DIR = Path.home() / "Documents"\n',
              'DOCUMENTS_DIR = Path(os.environ.get("FLY_TERMINAL_DOCUMENTS_DIR", str(Path.home() / "Documents"))).expanduser()\n',
              "session-control Documents directory",
          )
          path.write_text(text, encoding="utf-8")

          # Bind the same host directory into the browser container so Chromium's
          # file chooser /config/Documents sees files uploaded through Tools.
          path = Path("macos/launch-browser.sh")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              'FLY_BROWSER_PROFILE_VOLUME="${FLY_BROWSER_PROFILE_VOLUME:-fly-terminal-browser-profile}"\nFLY_BROWSER_PASSWORD=',
              'FLY_BROWSER_PROFILE_VOLUME="${FLY_BROWSER_PROFILE_VOLUME:-fly-terminal-browser-profile}"\nFLY_TERMINAL_DOCUMENTS_DIR="${FLY_TERMINAL_DOCUMENTS_DIR:-${HOME}/Documents}"\nFLY_BROWSER_PASSWORD=',
              "browser Documents variable",
          )
          text = replace_once(
              text,
              '''container_has_required_settings() {
  local env_dump
  env_dump="$(docker inspect "${FLY_BROWSER_CONTAINER_NAME}" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null)" || return 1
  grep -qx 'SELKIES_AUDIO_ENABLED=false|locked' <<<"${env_dump}" &&
    grep -qx 'SELKIES_MICROPHONE_ENABLED=false|locked' <<<"${env_dump}" &&
    grep -qx 'SELKIES_USE_BROWSER_CURSORS=true' <<<"${env_dump}" &&
    grep -qx "CHROME_CLI=${FLY_BROWSER_CHROME_CLI}" <<<"${env_dump}"
}
''',
              '''container_has_required_settings() {
  local env_dump documents_label
  env_dump="$(docker inspect "${FLY_BROWSER_CONTAINER_NAME}" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null)" || return 1
  documents_label="$(docker inspect "${FLY_BROWSER_CONTAINER_NAME}" --format '{{index .Config.Labels "fly-terminal.documents-dir"}}' 2>/dev/null)" || return 1
  grep -qx 'SELKIES_AUDIO_ENABLED=false|locked' <<<"${env_dump}" &&
    grep -qx 'SELKIES_MICROPHONE_ENABLED=false|locked' <<<"${env_dump}" &&
    grep -qx 'SELKIES_USE_BROWSER_CURSORS=true' <<<"${env_dump}" &&
    grep -qx "CHROME_CLI=${FLY_BROWSER_CHROME_CLI}" <<<"${env_dump}" &&
    [ "${documents_label}" = "${FLY_TERMINAL_DOCUMENTS_DIR}" ]
}
''',
              "browser settings check",
          )
          text = replace_once(
              text,
              'mkdir -p "${FLY_BROWSER_PROFILE_DIR}"\n',
              'mkdir -p "${FLY_BROWSER_PROFILE_DIR}" "${FLY_TERMINAL_DOCUMENTS_DIR}"\n',
              "browser Documents mkdir",
          )
          text = replace_once(
              text,
              '''      --name "${FLY_BROWSER_CONTAINER_NAME}" \\
      --restart unless-stopped \\
      --shm-size=1g \\
      -p "127.0.0.1:${FLY_BROWSER_HOST_PORT}:${FLY_BROWSER_CONTAINER_PORT}" \\
''',
              '''      --name "${FLY_BROWSER_CONTAINER_NAME}" \\
      --restart unless-stopped \\
      --label "fly-terminal.documents-dir=${FLY_TERMINAL_DOCUMENTS_DIR}" \\
      --shm-size=1g \\
      -p "127.0.0.1:${FLY_BROWSER_HOST_PORT}:${FLY_BROWSER_CONTAINER_PORT}" \\
''',
              "linuxserver Documents label",
          )
          text = replace_once(
              text,
              '''      -e "CHROME_CLI=${FLY_BROWSER_CHROME_CLI}" \\
      -v "${FLY_BROWSER_PROFILE_VOLUME}:/config" \\
      "${FLY_BROWSER_IMAGE}" >/dev/null
''',
              '''      -e "CHROME_CLI=${FLY_BROWSER_CHROME_CLI}" \\
      -v "${FLY_BROWSER_PROFILE_VOLUME}:/config" \\
      -v "${FLY_TERMINAL_DOCUMENTS_DIR}:/config/Documents" \\
      "${FLY_BROWSER_IMAGE}" >/dev/null
''',
              "linuxserver Documents mount",
          )
          text = replace_once(
              text,
              '''      --name "${FLY_BROWSER_CONTAINER_NAME}" \\
      --restart unless-stopped \\
      --shm-size=1g \\
      -p "127.0.0.1:${FLY_BROWSER_HOST_PORT}:6901" \\
''',
              '''      --name "${FLY_BROWSER_CONTAINER_NAME}" \\
      --restart unless-stopped \\
      --label "fly-terminal.documents-dir=${FLY_TERMINAL_DOCUMENTS_DIR}" \\
      --shm-size=1g \\
      -p "127.0.0.1:${FLY_BROWSER_HOST_PORT}:6901" \\
''',
              "kasm Documents label",
          )
          text = replace_once(
              text,
              '''      -e "DISABLE_CUSTOM_STARTUP=1" \\
      -v "${FLY_BROWSER_PROFILE_VOLUME}:/home/kasm-user" \\
      "${FLY_BROWSER_IMAGE}" >/dev/null
''',
              '''      -e "DISABLE_CUSTOM_STARTUP=1" \\
      -v "${FLY_BROWSER_PROFILE_VOLUME}:/home/kasm-user" \\
      -v "${FLY_TERMINAL_DOCUMENTS_DIR}:/home/kasm-user/Documents" \\
      "${FLY_BROWSER_IMAGE}" >/dev/null
''',
              "kasm Documents mount",
          )
          path.write_text(text, encoding="utf-8")

          # Keep the architecture documented: Tools and Chromium share the same host directory.
          path = Path("TOOLS.md")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              'Файловый обмен реализован как штатный инструмент раздела **Tools** и обслуживается `session-control.py`. Рабочая область инструмента — только `Path.home() / "Documents"` виртуальной машины; текущий каталог tmux-сессии для этой функции не используется.\n',
              'Файловый обмен реализован как штатный инструмент раздела **Tools** и обслуживается `session-control.py`. Канонический каталог задаётся `FLY_TERMINAL_DOCUMENTS_DIR` и по умолчанию равен `~/Documents` пользователя macOS; текущий каталог tmux-сессии для этой функции не используется. Browser-модуль монтирует этот же каталог в контейнер Chromium как `/config/Documents` (linuxserver) или `/home/kasm-user/Documents` (Kasm), поэтому Tools и файловый диалог браузера всегда работают с одними и теми же файлами. Изменение значения `FLY_TERMINAL_DOCUMENTS_DIR` автоматически приводит к пересозданию browser-контейнера при следующем запуске `launch-browser.sh`.\n',
              "TOOLS Documents architecture",
          )
          path.write_text(text, encoding="utf-8")

          # Validate before committing.
          subprocess.run(["python", "-m", "py_compile", "session-control.py"], check=True)
          subprocess.run(["bash", "-n", "macos/launch-browser.sh"], check=True)
          subprocess.run(["git", "diff", "--check"], check=True)

          # Remove all temporary implementation machinery from previous turns and
          # restore the original Gemini dispatcher before making the final commit.
          original_dispatch = subprocess.check_output(
              ["git", "show", "44f4d6fc73ee604010a9f3bcbf42b5bc118efbc1:.github/workflows/gemini-dispatch.yml"],
              text=True,
          )
          Path(".github/workflows/gemini-dispatch.yml").write_text(original_dispatch, encoding="utf-8")
          for temporary in (
              Path(".github/workflows/implement-file-tools.yml"),
              Path("tools/implement_file_tools_once.py"),
          ):
              if temporary.exists():
                  temporary.unlink()

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "-A"], check=True)
          subprocess.run(["git", "diff", "--cached", "--check"], check=True)
          subprocess.run(["git", "commit", "-m", "Share Documents with Chromium container"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          PY
