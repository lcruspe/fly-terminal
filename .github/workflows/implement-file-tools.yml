name: Implement file tools once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('tools/implement_file_tools_once.py').read_text(encoding='utf-8')
          exec(compile(source, 'implement-file-tools', 'exec'), {'__name__': '__main__'})
          PY
