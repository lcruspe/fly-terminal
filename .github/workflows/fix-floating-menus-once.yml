name: Fix floating menus once

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >-
      github.event.issue.title == 'Trigger: fix floating menus' &&
      (github.event_name == 'issues' || github.event.comment.body == '@apply-floating-menu-fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply floating menu fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_height = '''        const spaceAbove = buttonRect.top - gap - viewportPad;
                  maxHeight = Math.max(120, Math.min(spaceAbove, viewportHeight - viewportPad * 2));'''
          if old_height not in text:
              old_height = '''        const spaceAbove = buttonRect.top - gap - viewportPad;
          maxHeight = Math.max(120, Math.min(spaceAbove, viewportHeight - viewportPad * 2));'''
          new_height = '''        // Let the popup use the viewport height, then position the measured box.
          // This avoids CSS padding/border differences making a bottom-anchored menu
          // leak a few pixels above the viewport.
          maxHeight = Math.max(1, viewportHeight - viewportPad * 2);'''
          if old_height not in text:
              raise SystemExit('horizontal max-height anchor block not found')
          text = text.replace(old_height, new_height, 1)

          old_anchor = '''        // Use bottom anchor directly: distance from bottom of screen to top of toolbar button
          const bottomDistance = viewportHeight - buttonRect.top + gap;

          menu.style.position = "fixed";
          menu.style.left = `${Math.round(left)}px`;
          menu.style.bottom = `${Math.round(bottomDistance)}px`;
          menu.style.top = "auto";
          menu.style.right = "auto";
          menu.style.maxHeight = `${Math.floor(maxHeight)}px`;
          menu.style.maxWidth = `${Math.floor(maxWidth)}px`;
          menu.style.zIndex = "9999";
          menu.style.transformOrigin = "bottom right";
          return;'''
          new_anchor = '''        menu.style.position = "fixed";
          menu.style.left = `${Math.round(left)}px`;
          menu.style.top = `${viewportPad}px`;
          menu.style.bottom = "auto";
          menu.style.right = "auto";
          menu.style.maxHeight = `${Math.floor(maxHeight)}px`;
          menu.style.maxWidth = `${Math.floor(maxWidth)}px`;
          menu.style.zIndex = "9999";
          menu.style.transformOrigin = "bottom right";

          // Measure after max-size constraints have been applied, then clamp both
          // axes explicitly. Top-based positioning is deterministic even when the
          // popup's border/padding changes its final rendered height.
          const fittedRect = menu.getBoundingClientRect();
          const fittedHeight = Math.min(fittedRect.height, maxHeight);
          const fittedWidth = Math.min(fittedRect.width, maxWidth);
          left = clampNumber(
            buttonRect.right - fittedWidth,
            viewportPad,
            Math.max(viewportPad, viewportWidth - viewportPad - fittedWidth)
          );
          top = clampNumber(
            buttonRect.top - gap - fittedHeight,
            viewportPad,
            Math.max(viewportPad, viewportHeight - viewportPad - fittedHeight)
          );
          menu.style.left = `${Math.round(left)}px`;
          menu.style.top = `${Math.round(top)}px`;
          return;'''
          if old_anchor not in text:
              raise SystemExit('horizontal bottom anchor block not found')
          text = text.replace(old_anchor, new_anchor, 1)

          old_bind = '''    function bindFloatingMenus() {
      floatingMenuResizeObserver = new ResizeObserver(() => positionOpenFloatingMenus());
      document.querySelectorAll("details.settings, details.dropdown").forEach((details) => {'''
          new_bind = '''    function closeFloatingMenus({ except = null } = {}) {
      document.querySelectorAll("details.settings[open], details.dropdown[open]").forEach((details) => {
        if (details === except) return;
        details.removeAttribute("open");
        resetFloatingMenuPosition(details);
      });
    }

    function bindFloatingMenus() {
      floatingMenuResizeObserver = new ResizeObserver(() => positionOpenFloatingMenus());

      document.addEventListener("pointerdown", (event) => {
        const containingMenu = event.target.closest?.("details.settings, details.dropdown") || null;
        closeFloatingMenus({ except: containingMenu });
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeFloatingMenus();
      });

      document.querySelectorAll("details.settings, details.dropdown").forEach((details) => {'''
          if old_bind not in text:
              raise SystemExit('bindFloatingMenus block not found')
          text = text.replace(old_bind, new_bind, 1)

          path.write_text(text, encoding='utf-8')

          ui = Path('UI.md')
          docs = ui.read_text(encoding='utf-8')
          section = '''\n## Floating menus\n\nSettings, Tools, dropdown, and responsive overflow panels use viewport-fixed positioning. After size constraints are applied, the rendered popup is measured and both axes are clamped to a 10 px viewport inset; do not rely on a bottom anchor alone because borders/padding can otherwise push tall menus outside the viewport. The same positioning path is used for horizontal and vertical toolbar orientations.\n\nOnly one top-level floating menu should remain active at a time. Clicking outside `details.settings` / `details.dropdown` closes open floating menus, and `Escape` closes them as well. Clicks inside the currently open menu must not dismiss it. These behaviors are part of the menu interaction contract and should be covered by browser smoke tests when positioning logic changes.\n'''
          if '## Floating menus' not in docs:
              docs = docs.rstrip() + '\n' + section
              ui.write_text(docs, encoding='utf-8')
          PY

      - name: Validate syntax
        run: |
          python -m py_compile session-control.py
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('inline script not found')
          Path('/tmp/fly-terminal-index.js').write_text(html[start + len('<script>'):end], encoding='utf-8')
          PY
          node --check /tmp/fly-terminal-index.js
          git diff --check
          grep -q 'function closeFloatingMenus' index.html
          grep -q 'const fittedRect = menu.getBoundingClientRect();' index.html
          grep -q '## Floating menus' UI.md

      - name: Prepare browser smoke test
        run: |
          python -m pip install --quiet selenium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/flyterm-http.log 2>&1 &
          sleep 2

      - name: Run browser smoke test
        id: smoke
        continue-on-error: true
        run: |
          set +e
          python3 - <<'PY'
          import json
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,900')
          driver = webdriver.Chrome(options=opts)
          wait = WebDriverWait(driver, 12)

          stub = r'''
          (() => {
            const realFetch = window.fetch.bind(window);
            const ok = (payload) => Promise.resolve(new Response(JSON.stringify(payload), {
              status: 200,
              headers: {'Content-Type':'application/json'}
            }));
            window.fetch = (input, init = {}) => {
              const url = typeof input === 'string' ? input : (input && input.url) || '';
              if (!url.includes('/api/')) return realFetch(input, init);
              if (url.includes('/api/ui/preferences')) return ok({ok:true});
              if (url.includes('/api/browser/config')) return ok({ok:true, enabled:false, url:''});
              if (url.includes('/api/desktop/config')) return ok({ok:true, enabled:false, url:'', rawUrl:''});
              if (url.includes('/api/apps/list')) return ok({ok:true, apps:[]});
              if (url.includes('/api/mac/apps/list')) return ok({ok:true, apps:[]});
              if (url.includes('/api/files/list')) return ok({ok:true, directory:'Documents', maxUploadBytes:26214400, files:[]});
              if (url.includes('/api/vpn/happ/subscriptions') || url.includes('/api/vpn/happ/locations')) return ok({ok:true, subscriptions:[], configured:false, current:'', currentSubscriptionId:'', currentLocationId:''});
              if (url.includes('/api/vpn/happ/status')) return ok({ok:true, state:'Disconnected', location:''});
              if (url.includes('/api/system/recover/status') || url.includes('/api/system/update/status')) return ok({ok:true, state:'idle', summary:'', entries:[]});
              if (url.includes('/api/sessions/list')) return ok({ok:true, sessions:[]});
              return ok({ok:true});
            };
          })();
          '''
          driver.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument', {'source': stub})
          driver.get('http://127.0.0.1:8765/index.html')
          wait.until(lambda d: d.find_element(By.ID, 'settingsMenu'))
          wait.until(lambda d: d.execute_script('return document.readyState') == 'complete')
          time.sleep(0.8)

          failures = []
          results = []
          PAD = 9

          def close_all():
              driver.execute_script("document.querySelectorAll('details[open]').forEach(d => d.removeAttribute('open'))")
              time.sleep(0.05)

          def check_menu(menu_id, orientation):
              close_all()
              driver.execute_script("applyToolbarOrientation(arguments[0]);", orientation)
              time.sleep(0.12)
              details = driver.find_element(By.ID, menu_id)
              summary = details.find_element(By.CSS_SELECTOR, ':scope > summary')
              driver.execute_script('arguments[0].scrollIntoView({block:"center", inline:"center"})', summary)
              summary.click()
              wait.until(lambda d: details.get_attribute('open') is not None)
              time.sleep(0.18)
              panel = details.find_element(By.CSS_SELECTOR, ':scope > summary + *')
              m = driver.execute_script('''
                const r = arguments[0].getBoundingClientRect();
                const cs = getComputedStyle(arguments[0]);
                return {left:r.left, top:r.top, right:r.right, bottom:r.bottom,
                        width:r.width, height:r.height, vw:innerWidth, vh:innerHeight,
                        display:cs.display, visibility:cs.visibility, position:cs.position};
              ''', panel)
              ok = (m['width'] > 0 and m['height'] > 0 and m['display'] != 'none' and
                    m['visibility'] != 'hidden' and m['position'] == 'fixed' and
                    m['left'] >= PAD and m['top'] >= PAD and
                    m['right'] <= m['vw'] - PAD and m['bottom'] <= m['vh'] - PAD)
              results.append({'menu':menu_id,'orientation':orientation,'ok':ok,'metrics':m})
              if not ok:
                  failures.append(f'{menu_id}/{orientation}: {m}')

          driver.set_window_size(1440, 900)
          for orientation in ('horizontal', 'vertical-left', 'vertical-right'):
              check_menu('settingsMenu', orientation)
              check_menu('toolsMenu', orientation)

          # Opening another top-level menu must leave only the new one open.
          driver.set_window_size(1440, 900)
          driver.execute_script("applyToolbarOrientation('horizontal');")
          close_all()
          settings = driver.find_element(By.ID, 'settingsMenu')
          tools = driver.find_element(By.ID, 'toolsMenu')
          settings.find_element(By.CSS_SELECTOR, ':scope > summary').click()
          tools.find_element(By.CSS_SELECTOR, ':scope > summary').click()
          time.sleep(0.1)
          exclusivity = settings.get_attribute('open') is None and tools.get_attribute('open') is not None
          results.append({'behavior':'exclusivity','ok':exclusivity})
          if not exclusivity: failures.append('opening Tools did not close Settings')

          # A genuine outside pointer/click closes the menu.
          terminal = driver.find_element(By.CSS_SELECTOR, '.terminal-container')
          terminal.click()
          time.sleep(0.1)
          outside_closed = tools.get_attribute('open') is None
          results.append({'behavior':'outside-click','ok':outside_closed})
          if not outside_closed: failures.append('outside click did not close Tools')

          # Escape closes a floating menu without relying on focus inside it.
          settings.find_element(By.CSS_SELECTOR, ':scope > summary').click()
          time.sleep(0.08)
          driver.find_element(By.TAG_NAME, 'body').send_keys(Keys.ESCAPE)
          time.sleep(0.1)
          escape_closed = settings.get_attribute('open') is None
          results.append({'behavior':'escape','ok':escape_closed})
          if not escape_closed: failures.append('Escape did not close Settings')

          # A click inside the panel must keep it open.
          settings.find_element(By.CSS_SELECTOR, ':scope > summary').click()
          time.sleep(0.08)
          panel = settings.find_element(By.CSS_SELECTOR, ':scope > summary + *')
          driver.execute_script("arguments[0].dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));", panel)
          time.sleep(0.08)
          inside_kept = settings.get_attribute('open') is not None
          results.append({'behavior':'inside-click','ok':inside_kept})
          if not inside_kept: failures.append('inside pointerdown unexpectedly closed Settings')

          print('FLOATING_MENU_RESULTS=' + json.dumps(results, ensure_ascii=False))
          if failures:
              print('FLOATING_MENU_FAILURES=' + json.dumps(failures, ensure_ascii=False))
              raise SystemExit(1)
          driver.quit()
          PY
          rc=$?
          echo "$rc" >/tmp/floating-menu-smoke-status
          exit 0

      - name: Finalize and push
        if: always()
        run: |
          rc=$(cat /tmp/floating-menu-smoke-status 2>/dev/null || echo 99)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$rc" != "0" ]; then
            git restore --source=HEAD -- index.html UI.md
          fi
          rm -f .github/workflows/fix-floating-menus-once.yml
          git diff --check
          git add -A
          if ! git diff --cached --quiet; then
            if [ "$rc" = "0" ]; then
              git commit -m 'Fix floating menu viewport behavior'
            else
              git commit -m 'chore: remove failed floating menu runner'
            fi
            git push origin HEAD:main
          fi
          exit "$rc"

      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
