name: Apply full-width layout once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == 'Trigger: apply full-width Fly Terminal layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply full-width layout
        run: python tools/_apply_full_width_once.py

      - name: Validate layout contract
        run: |
          grep -q 'padding: 14px 0;' index.html
          grep -q '## Edge-to-edge horizontal layout' UI.md
          if grep -q '^  apply-full-width:$' .github/workflows/gemini-dispatch.yml; then
            echo 'Temporary Gemini dispatch job was not removed' >&2
            exit 1
          fi
          git diff --check

      - name: Clean one-shot files and push
        run: |
          rm tools/_apply_full_width_once.py
          rm .github/workflows/apply-full-width.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make Fly Terminal panels full width'
          git push origin HEAD:main

      - name: Close trigger issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
