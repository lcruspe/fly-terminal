name: Apply full-width layout

on:
  push:
    paths:
      - '.github/workflows/apply-full-width.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply edge-to-edge horizontal layout
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = '''      height: 100vh;\n      padding: 14px;\n      position: relative;'''
          new = '''      height: 100vh;\n      padding: 14px 0;\n      position: relative;'''
          if old not in text:
              raise SystemExit('Expected .shell padding block was not found')
          text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          ui = Path('UI.md')
          docs = ui.read_text(encoding='utf-8').rstrip()
          section = '''\n\n## Edge-to-edge horizontal layout\n\nThe Fly Terminal shell has no horizontal page padding. The terminal/browser workspace, tab bar, and main toolbar therefore span the full viewport width, while the 14 px vertical shell padding and 12 px vertical spacing between sections are preserved. Do not reintroduce horizontal padding on `.shell`; add any required spacing inside individual controls instead.\n'''
          if '## Edge-to-edge horizontal layout' not in docs:
              docs += section
          ui.write_text(docs + '\n', encoding='utf-8')
          PY

      - name: Verify change
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert 'padding: 14px 0;' in text
          assert 'padding: 14px;\n      position: relative;' not in text
          PY
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html UI.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make Fly Terminal panels full width"
          git push origin HEAD:main
