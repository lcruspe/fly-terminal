name: Apply container file browser once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == 'Trigger: apply container file browser'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and validate
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python tools/_apply_container_file_browser_once.py
            python -m py_compile session-control.py
            python -c "import importlib.util; s=importlib.util.spec_from_file_location('sc','session-control.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert m.normalize_container_browser_path('/') == '/'; assert m.normalize_container_browser_path('/config/../etc') == '/etc'; assert m.normalize_container_browser_path('etc') == ''; assert m.container_browser_path_blocked('/proc/1'); assert not m.container_browser_path_blocked('/config')"
            python -c "from pathlib import Path; h=Path('index.html').read_text(encoding='utf-8'); a=h.rfind('<script>'); b=h.rfind('</script>'); assert a >= 0 and b > a; Path('/tmp/fly-terminal-index.js').write_text(h[a+8:b], encoding='utf-8')"
            node --check /tmp/fly-terminal-index.js
            git diff --check
          } 2>&1 | tee /tmp/container-file-browser.log

      - name: Report validation failure
        if: steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tail -120 /tmp/container-file-browser.log > /tmp/container-file-browser-tail.log
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file /tmp/container-file-browser-tail.log

      - name: Clean one-shot files and push
        if: steps.validate.outcome == 'success'
        run: |
          rm tools/_apply_container_file_browser_once.py
          rm .github/workflows/apply-container-file-browser-once.yml
          rm -f tools/_container_file_browser_validation_marker.txt tools/.container-file-browser-trigger-note
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add container file browser downloads'
          git push origin HEAD:main

      - name: Close trigger issue
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Fail after reporting
        if: steps.validate.outcome == 'failure'
        run: exit 1
