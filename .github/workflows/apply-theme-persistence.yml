name: Apply theme persistence

on:
  push:
    branches:
      - fix/persist-theme-between-sessions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persist-theme-between-sessions

      - name: Apply persistent theme storage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          # --- session-control.py ---
          path = Path("session-control.py")
          text = path.read_text(encoding="utf-8")

          text = replace_once(
              text,
              '''UPDATE_SCRIPT = REPO_ROOT / "tools" / "update_stack.py"\nHAPP_VPN_SERVICE = os.environ.get("FLY_TERMINAL_HAPP_SERVICE", "Happ Plus")''',
              '''UPDATE_SCRIPT = REPO_ROOT / "tools" / "update_stack.py"\nUI_PREFERENCES_FILE = Path(os.environ.get(\n    "FLY_TERMINAL_UI_PREFERENCES_FILE",\n    str(Path.home() / ".local/share/fly-terminal/ui-preferences.json"),\n)).expanduser()\nUI_PREFERENCES_LOCK = threading.Lock()\nVALID_UI_THEMES = frozenset({\n    "paper", "linen", "ledger", "harbor", "sage",\n    "graphite", "ink", "midnight", "nord", "forest",\n})\nHAPP_VPN_SERVICE = os.environ.get("FLY_TERMINAL_HAPP_SERVICE", "Happ Plus")''',
              "insert UI preference constants",
          )

          text = replace_once(
              text,
              '''    "update_start_failed": "Не удалось запустить обновление Fly Terminal.",\n    "reconnect_already_running":''',
              '''    "update_start_failed": "Не удалось запустить обновление Fly Terminal.",\n    "invalid_theme": "Выбрана неизвестная тема оформления.",\n    "ui_preferences_write_failed": "Не удалось сохранить тему оформления.",\n    "reconnect_already_running":''',
              "add UI preference errors",
          )

          text = replace_once(
              text,
              '''\n\nclass SessionControlHandler(BaseHTTPRequestHandler):''',
              '''\n\ndef read_ui_preferences():\n    with UI_PREFERENCES_LOCK:\n        if not UI_PREFERENCES_FILE.exists():\n            return {"ok": True, "theme": None}\n        try:\n            payload = json.loads(UI_PREFERENCES_FILE.read_text(encoding="utf-8"))\n        except (OSError, json.JSONDecodeError):\n            return {"ok": True, "theme": None}\n\n    theme = str(payload.get("theme") or "").strip()\n    if theme not in VALID_UI_THEMES:\n        theme = ""\n    return {"ok": True, "theme": theme or None}\n\n\ndef write_ui_preferences(theme):\n    payload = {\n        "theme": theme,\n        "updatedAt": datetime.now().isoformat(),\n    }\n    UI_PREFERENCES_FILE.parent.mkdir(parents=True, exist_ok=True)\n    temp_path = UI_PREFERENCES_FILE.with_name(f"{UI_PREFERENCES_FILE.name}.tmp")\n    serialized = json.dumps(payload, ensure_ascii=False, indent=2) + "\\n"\n    with UI_PREFERENCES_LOCK:\n        temp_path.write_text(serialized, encoding="utf-8")\n        os.replace(temp_path, UI_PREFERENCES_FILE)\n\n\nclass SessionControlHandler(BaseHTTPRequestHandler):''',
              "add UI preference persistence helpers",
          )

          text = replace_once(
              text,
              '''        if self.path == "/api/browser/config":''',
              '''        if self.path == "/api/ui/preferences":\n            send_json(self, 200, read_ui_preferences())\n            return\n\n        if self.path == "/api/browser/config":''',
              "add UI preferences GET",
          )

          text = replace_once(
              text,
              '''    def do_POST(self):\n        if self.path == "/api/session/terminate":\n            self._handle_terminate()''',
              '''    def do_POST(self):\n        if self.path == "/api/ui/preferences":\n            self._handle_ui_preferences()\n        elif self.path == "/api/session/terminate":\n            self._handle_terminate()''',
              "add UI preferences POST",
          )

          text = replace_once(
              text,
              '''    def _handle_info(self):''',
              '''    def _handle_ui_preferences(self):\n        payload, error = self._read_json_body()\n        if error:\n            send_json(self, 400, {"ok": False, "error": error})\n            return\n\n        theme = str(payload.get("theme") or "").strip()\n        if theme not in VALID_UI_THEMES:\n            send_json(self, 400, {"ok": False, "error": "invalid_theme"})\n            return\n\n        try:\n            write_ui_preferences(theme)\n        except OSError as exc:\n            send_json(self, 500, {"ok": False, "error": "ui_preferences_write_failed", "details": str(exc)})\n            return\n\n        send_json(self, 200, {"ok": True, "theme": theme})\n\n    def _handle_info(self):''',
              "add UI preferences handler",
          )

          path.write_text(text, encoding="utf-8")

          # --- index.html ---
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          text = replace_once(
              text,
              '''    function savePreferences() {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify(preferences));\n      applyAllThemes();\n      applyWindowTitle();\n    }\n\n    function setStatusText''',
              '''    function savePreferences() {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify(preferences));\n      applyAllThemes();\n      applyWindowTitle();\n    }\n\n    async function persistThemePreference() {\n      try {\n        const response = await localApiFetch("/api/ui/preferences", {\n          method: "POST",\n          headers: { "Content-Type": "application/json" },\n          body: JSON.stringify({ theme: preferences.theme })\n        });\n        if (!response.ok) throw new Error(`HTTP ${response.status}`);\n      } catch (error) {\n        console.warn("Unable to persist Fly Terminal theme on server", error);\n      }\n    }\n\n    async function loadPersistedTheme() {\n      try {\n        const response = await localApiFetch("/api/ui/preferences");\n        if (!response.ok) return;\n        const payload = await response.json().catch(() => ({}));\n        if (payload?.theme && themes[payload.theme]) {\n          preferences.theme = payload.theme;\n          localStorage.setItem(STORAGE_KEY, JSON.stringify(preferences));\n          return;\n        }\n        if (themes[preferences.theme]) {\n          await persistThemePreference();\n        }\n      } catch (error) {\n        console.warn("Unable to load persisted Fly Terminal theme", error);\n      }\n    }\n\n    function setStatusText''',
              "add client theme persistence",
          )

          text = replace_once(
              text,
              '''    themeButtons.forEach(btn => btn.onclick = () => { preferences.theme = btn.dataset.theme; savePreferences(); applyAllThemes(); });''',
              '''    themeButtons.forEach(btn => btn.onclick = () => {\n      preferences.theme = btn.dataset.theme;\n      savePreferences();\n      persistThemePreference();\n    });''',
              "persist theme on selection",
          )

          text = replace_once(
              text,
              '''    // Initial load\n    applyShellTheme();\n    refreshDirectLink();\n    loadBrowserConfig().finally(() => {\n      loadBrowserApps();\n      loadSessions();\n      setTimeout(verifyBootUi, 2000);\n    });\n    setInterval(updateTabLabels, 10000);''',
              '''    // Initial load\n    async function initializeApp() {\n      await loadPersistedTheme();\n      applyShellTheme();\n      refreshDirectLink();\n      try {\n        await loadBrowserConfig();\n      } finally {\n        loadBrowserApps();\n        loadSessions();\n        setTimeout(verifyBootUi, 2000);\n      }\n    }\n\n    initializeApp();\n    setInterval(updateTabLabels, 10000);''',
              "load persisted theme before sessions",
          )

          path.write_text(text, encoding="utf-8")

          # --- THEMING.md ---
          path = Path("THEMING.md")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''The choice is saved in browser `localStorage`, so the same browser opens the next session with the last selected theme, font size, and font family. The selected preset also drives the embedded ttyd/xterm colors.''',
              '''The selected **theme** is persisted in two layers. The backend stores the canonical value in `~/.local/share/fly-terminal/ui-preferences.json` (override with `FLY_TERMINAL_UI_PREFERENCES_FILE`), while browser `localStorage` remains a fast cache and fallback. On startup the backend value wins; if the backend has no saved theme yet, the browser's current local theme seeds it. This keeps the theme stable across terminal sessions, browser restarts, and different browser entry origins that point to the same Fly Terminal backend.\n\nFont size, font family, window title, layout and panel state remain browser-local preferences. The selected theme continues to drive the embedded ttyd/xterm colors.''',
              "document server-side theme persistence",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate changes
        run: |
          python3 -m py_compile session-control.py
          python3 - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("session_control", "session-control.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with tempfile.TemporaryDirectory() as temp_dir:
              module.UI_PREFERENCES_FILE = Path(temp_dir) / "ui-preferences.json"
              assert module.read_ui_preferences() == {"ok": True, "theme": None}
              module.write_ui_preferences("nord")
              assert module.read_ui_preferences() == {"ok": True, "theme": "nord"}
          PY
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          start = html.index("<script>") + len("<script>")
          end = html.rindex("</script>")
          Path("/tmp/fly-terminal-index.js").write_text(html[start:end], encoding="utf-8")
          PY
          node --check /tmp/fly-terminal-index.js
          grep -q '/api/ui/preferences' index.html
          grep -q 'FLY_TERMINAL_UI_PREFERENCES_FILE' THEMING.md
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- index.html session-control.py THEMING.md
          git commit -m "Persist theme across Fly Terminal sessions"
          git push origin HEAD:fix/persist-theme-between-sessions
