name: Arm floating menu fix

on:
  push:
    branches: [main]

permissions:
  issues: write

jobs:
  trigger:
    if: github.event.head_commit.message == 'chore: arm floating menu trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger one-shot fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 17 --repo "${{ github.repository }}" --body '@apply-floating-menu-fix'
