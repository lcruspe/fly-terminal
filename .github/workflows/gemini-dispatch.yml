name: '🔀 Gemini Dispatch'

on:
  pull_request_review_comment:
    types:
      - 'created'
  pull_request_review:
    types:
      - 'submitted'
  pull_request:
    types:
      - 'opened'
  issues:
    types:
      - 'opened'
      - 'reopened'
  issue_comment:
    types:
      - 'created'

defaults:
  run:
    shell: 'bash'

jobs:
  debugger:
    if: |-
      ${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - name: 'Print context for debugging'
        env:
          DEBUG_event_name: '${{ github.event_name }}'
          DEBUG_event__action: '${{ github.event.action }}'
          DEBUG_event__comment__author_association: '${{ github.event.comment.author_association }}'
          DEBUG_event__issue__author_association: '${{ github.event.issue.author_association }}'
          DEBUG_event__pull_request__author_association: '${{ github.event.pull_request.author_association }}'
          DEBUG_event__review__author_association: '${{ github.event.review.author_association }}'
          DEBUG_event: '${{ toJSON(github.event) }}'
        run: |-
          env | grep '^DEBUG_'

  dispatch:
    # For PRs: only if not from a fork
    # For issues: only on open/reopen
    # For comments: only if user types @gemini-cli and is OWNER/MEMBER/COLLABORATOR
    if: |-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false
      ) || (
        github.event_name == 'issues' &&
        contains(fromJSON('["opened", "reopened"]'), github.event.action)
      ) || (
        github.event.sender.type == 'User' &&
        startsWith(github.event.comment.body || github.event.review.body || github.event.issue.body, '@gemini-cli') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
      )
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      command: '${{ steps.extract_command.outputs.command }}'
      request: '${{ steps.extract_command.outputs.request }}'
      additional_context: '${{ steps.extract_command.outputs.additional_context }}'
      issue_number: '${{ github.event.pull_request.number || github.event.issue.number }}'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Extract command'
        id: 'extract_command'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7
        env:
          EVENT_TYPE: '${{ github.event_name }}.${{ github.event.action }}'
          REQUEST: '${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}'
        with:
          script: |
            const eventType = process.env.EVENT_TYPE;
            const request = process.env.REQUEST;
            core.setOutput('request', request);

            if (eventType === 'pull_request.opened') {
              core.setOutput('command', 'review');
            } else if (['issues.opened', 'issues.reopened'].includes(eventType)) {
              core.setOutput('command', 'triage');
            } else if (request.startsWith("@gemini-cli /review")) {
              core.setOutput('command', 'review');
              const additionalContext = request.replace(/^@gemini-cli \/review/, '').trim();
              core.setOutput('additional_context', additionalContext);
            } else if (request.startsWith("@gemini-cli /triage")) {
              core.setOutput('command', 'triage');
            } else if (request.startsWith("@gemini-cli /approve")) {
              core.setOutput('command', 'approve');
            } else if (request.startsWith("@gemini-cli")) {
              const additionalContext = request.replace(/^@gemini-cli/, '').trim();
              core.setOutput('command', 'invoke');
              core.setOutput('additional_context', additionalContext);
            } else {
              core.setOutput('command', 'fallthrough');
            }

      - name: 'Acknowledge request'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          MESSAGE: |-
            🤖 Hi @${{ github.actor }}, I've received your request, and I'm working on it now! You can track my progress [in the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"

  review:
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.command == 'review' }}
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  triage:
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.command == 'triage' }}
    uses: './.github/workflows/gemini-triage.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  invoke:
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.command == 'invoke' }}
    uses: './.github/workflows/gemini-invoke.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  plan-execute:
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.command == 'approve' }}
    uses: './.github/workflows/gemini-plan-execute.yml'
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  fallthrough:
    needs:
      - 'dispatch'
      - 'review'
      - 'triage'
      - 'invoke'
      - 'plan-execute'
    if: |-
      ${{ always() && !cancelled() && (failure() || needs.dispatch.outputs.command == 'fallthrough') }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Send failure comment'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          MESSAGE: |-
            🤖 I'm sorry @${{ github.actor }}, but I was unable to process your request. Please [see the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"

# TEMP_HAPP_SUBSCRIPTIONS_START
  happ-subscriptions-implementation:
    if: github.event_name == 'issue_comment' && github.event.issue.number == 1 && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@apply-happ-subscription-menu')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and validate Happ subscription menus
        run: |-
          python tools/_apply_happ_subscriptions_once.py
          python -m py_compile session-control.py
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('inline script not found')
          Path('/tmp/fly-terminal-index.js').write_text(html[start + len('<script>'):end], encoding='utf-8')
          PY
          node --check /tmp/fly-terminal-index.js
          python - <<'PY'
          import importlib.util
          import json
          import plistlib
          import sqlite3
          import tempfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('session_control', 'session-control.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          def config(label, address):
              return {
                  'remarks': label,
                  'outbounds': [{'protocol': 'vless', 'settings': {'address': address}}],
              }

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              cache_dir = root / 'fsCachedData'
              cache_dir.mkdir()
              cache_db = root / 'Cache.db'
              module.HAPP_CACHE_DIR = cache_dir
              module.HAPP_CACHE_DB = cache_db

              connection = sqlite3.connect(cache_db)
              connection.executescript('''
                  CREATE TABLE cfurl_cache_response(
                      entry_ID INTEGER PRIMARY KEY,
                      version INTEGER,
                      hash_value INTEGER,
                      storage_policy INTEGER,
                      request_key TEXT UNIQUE,
                      time_stamp TEXT
                  );
                  CREATE TABLE cfurl_cache_blob_data(
                      entry_ID INTEGER PRIMARY KEY,
                      response_object BLOB,
                      request_object BLOB,
                      proto_props BLOB,
                      user_info BLOB
                  );
                  CREATE TABLE cfurl_cache_receiver_data(
                      entry_ID INTEGER PRIMARY KEY,
                      isDataOnFS INTEGER,
                      receiver_data BLOB
                  );
              ''')
              first_body = json.dumps([config('Amsterdam', 'one'), config('Frankfurt', 'two')]).encode()
              first_meta = plistlib.dumps({'headers': {'profile-title': 'Primary VPN'}})
              connection.execute('INSERT INTO cfurl_cache_response VALUES (1,0,0,0,?,?)', ('https://one.example/sub/token', '2026-08-24 12:00:00'))
              connection.execute('INSERT INTO cfurl_cache_blob_data VALUES (1,?,?,?,?)', (first_meta, None, None, None))
              connection.execute('INSERT INTO cfurl_cache_receiver_data VALUES (1,0,?)', (first_body,))

              second_name = 'SECOND-CACHE-FILE'
              (cache_dir / second_name).write_bytes(json.dumps([config('Helsinki', 'three')]).encode())
              second_meta = plistlib.dumps({'headers': {'profile-title': 'U2Vjb25kIFZQTg=='}})
              connection.execute('INSERT INTO cfurl_cache_response VALUES (2,0,0,0,?,?)', ('https://two.example/sub/token', '2026-08-24 13:00:00'))
              connection.execute('INSERT INTO cfurl_cache_blob_data VALUES (2,?,?,?,?)', (second_meta, None, None, None))
              connection.execute('INSERT INTO cfurl_cache_receiver_data VALUES (2,1,?)', (second_name.encode(),))
              connection.commit()
              connection.close()

              subscriptions = module.happ_subscriptions()
              assert len(subscriptions) == 2, subscriptions
              assert {item['label'] for item in subscriptions} == {'Primary VPN', 'Second VPN'}, subscriptions
              assert sorted(len(item['locations']) for item in subscriptions) == [1, 2], subscriptions
          PY
          git diff --check
      - name: Remove one-shot machinery and push
        run: |-
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/gemini-dispatch.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = '\n# TEMP_HAPP_SUBSCRIPTIONS_START\n'
          end_marker = '# TEMP_HAPP_SUBSCRIPTIONS_END\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          path.write_text(text[:start] + '\n' + text[end:], encoding='utf-8')
          PY
          rm tools/_apply_happ_subscriptions_once.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add session-control.py index.html TOOLS.md .github/workflows/gemini-dispatch.yml tools/_apply_happ_subscriptions_once.py
          git commit -m 'Add Happ subscription and location selectors'
          git push origin HEAD:main
# TEMP_HAPP_SUBSCRIPTIONS_END
