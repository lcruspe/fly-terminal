name: '🔀 Gemini Dispatch'

on:
  pull_request_review_comment:
    types:
      - 'created'
  pull_request_review:
    types:
      - 'submitted'
  pull_request:
    types:
      - 'opened'
  issues:
    types:
      - 'opened'
      - 'reopened'
  issue_comment:
    types:
      - 'created'

defaults:
  run:
    shell: 'bash'

jobs:
  debugger:
    if: |-
      ${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - name: 'Print context for debugging'
        env:
          DEBUG_event_name: '${{ github.event_name }}'
          DEBUG_event__action: '${{ github.event.action }}'
          DEBUG_event__comment__author_association: '${{ github.event.comment.author_association }}'
          DEBUG_event__issue__author_association: '${{ github.event.issue.author_association }}'
          DEBUG_event__pull_request__author_association: '${{ github.event.pull_request.author_association }}'
          DEBUG_event__review__author_association: '${{ github.event.review.author_association }}'
          DEBUG_event: '${{ toJSON(github.event) }}'
        run: |-
          env | grep '^DEBUG_'

  dispatch:
    # For PRs: only if not from a fork
    # For issues: only on open/reopen
    # For comments: only if user types @gemini-cli and is OWNER/MEMBER/COLLABORATOR
    if: |-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false
      ) || (
        github.event_name == 'issues' &&
        contains(fromJSON('["opened", "reopened"]'), github.event.action)
      ) || (
        github.event.sender.type == 'User' &&
        startsWith(github.event.comment.body || github.event.review.body || github.event.issue.body, '@gemini-cli') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
      )
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      command: '${{ steps.extract_command.outputs.command }}'
      request: '${{ steps.extract_command.outputs.request }}'
      additional_context: '${{ steps.extract_command.outputs.additional_context }}'
      issue_number: '${{ github.event.pull_request.number || github.event.issue.number }}'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Extract command'
        id: 'extract_command'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7
        env:
          EVENT_TYPE: '${{ github.event_name }}.${{ github.event.action }}'
          REQUEST: '${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}'
        with:
          script: |
            const eventType = process.env.EVENT_TYPE;
            const request = process.env.REQUEST;
            core.setOutput('request', request);

            if (eventType === 'pull_request.opened') {
              core.setOutput('command', 'review');
            } else if (['issues.opened', 'issues.reopened'].includes(eventType)) {
              core.setOutput('command', 'triage');
            } else if (request.startsWith("@gemini-cli /review")) {
              core.setOutput('command', 'review');
              const additionalContext = request.replace(/^@gemini-cli \/review/, '').trim();
              core.setOutput('additional_context', additionalContext);
            } else if (request.startsWith("@gemini-cli /triage")) {
              core.setOutput('command', 'triage');
            } else if (request.startsWith("@gemini-cli /approve")) {
              core.setOutput('command', 'approve');
            } else if (request.startsWith("@gemini-cli")) {
              const additionalContext = request.replace(/^@gemini-cli/, '').trim();
              core.setOutput('command', 'invoke');
              core.setOutput('additional_context', additionalContext);
            } else {
              core.setOutput('command', 'fallthrough');
            }

      - name: 'Acknowledge request'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          MESSAGE: |-
            🤖 Hi @${{ github.actor }}, I've received your request, and I'm working on it now! You can track my progress [in the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"

  review:
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.command == 'review' }}
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  triage:
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.command == 'triage' }}
    uses: './.github/workflows/gemini-triage.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  invoke:
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.command == 'invoke' }}
    uses: './.github/workflows/gemini-invoke.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  plan-execute:
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.command == 'approve' }}
    uses: './.github/workflows/gemini-plan-execute.yml'
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  fallthrough:
    needs:
      - 'dispatch'
      - 'review'
      - 'triage'
      - 'invoke'
      - 'plan-execute'
    if: |-
      ${{ always() && !cancelled() && (failure() || needs.dispatch.outputs.command == 'fallthrough') }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Send failure comment'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          MESSAGE: |-
            🤖 I'm sorry @${{ github.actor }}, but I was unable to process your request. Please [see the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"

# TEMP_HAPP_TITLE_FIX_START
  happ-title-fix:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'Trigger: final Happ title decoder')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and validate Happ title decoder
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('session-control.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _normalize_happ_subscription_title(value):
    if isinstance(value, (bytes, bytearray)):
        try:
            value = bytes(value).decode("utf-8")
        except UnicodeDecodeError:
            return ""
    title = str(value or "").strip()
    if not title:
        return ""

    if " " not in title and len(title) >= 8 and re.fullmatch(r"[A-Za-z0-9+/=_-]+", title):
        padded = title + "=" * (-len(title) % 4)
        try:
            decoded_bytes = base64.b64decode(padded, altchars=b"-_", validate=True)
            decoded = decoded_bytes.decode("utf-8").strip()
            standard = base64.b64encode(decoded_bytes).decode("ascii").rstrip("=")
            urlsafe = base64.urlsafe_b64encode(decoded_bytes).decode("ascii").rstrip("=")
            if decoded and title.rstrip("=") in {standard, urlsafe} and all(char.isprintable() for char in decoded):
                title = decoded
        except (ValueError, UnicodeDecodeError):
            pass
    return title[:80]
'''
          new = '''def _normalize_happ_subscription_title(value):
    if isinstance(value, (bytes, bytearray)):
        try:
            value = bytes(value).decode("utf-8")
        except UnicodeDecodeError:
            return ""
    title = str(value or "").strip()
    if not title:
        return ""

    encoded_title = title
    explicit_base64 = False
    if title.casefold().startswith("base64:"):
        encoded_title = title.split(":", 1)[1].strip()
        explicit_base64 = True

    if encoded_title and " " not in encoded_title and len(encoded_title) >= 4 and re.fullmatch(r"[A-Za-z0-9+/=_-]+", encoded_title):
        padded = encoded_title + "=" * (-len(encoded_title) % 4)
        try:
            decoded_bytes = base64.b64decode(padded, altchars=b"-_", validate=True)
            decoded = decoded_bytes.decode("utf-8").strip()
            standard = base64.b64encode(decoded_bytes).decode("ascii").rstrip("=")
            urlsafe = base64.urlsafe_b64encode(decoded_bytes).decode("ascii").rstrip("=")
            canonical_match = encoded_title.rstrip("=") in {standard, urlsafe}
            if decoded and canonical_match and all(char.isprintable() for char in decoded):
                title = decoded
            elif explicit_base64:
                return ""
        except (ValueError, UnicodeDecodeError):
            if explicit_base64:
                return ""
    elif explicit_base64:
        return ""
    return title[:80]
'''
          if text.count(old) != 1:
              raise SystemExit(f'normalizer anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          docs = Path('TOOLS.md')
          text = docs.read_text(encoding='utf-8')
          old_docs = 'Название подписки извлекается из HTTP-метаданных `profile-title` в `response_object` (включая base64-вариант, поддерживаемый Happ).'
          new_docs = 'Название подписки извлекается из HTTP-метаданных `profile-title` в `response_object`. Поддерживаются как чистые Base64-значения, так и фактический формат Happ `base64:<payload>`; в UI всегда передаётся декодированное человекочитаемое название.'
          if old_docs not in text:
              raise SystemExit('TOOLS.md anchor not found')
          docs.write_text(text.replace(old_docs, new_docs, 1), encoding='utf-8')
          PY
          python -m py_compile session-control.py
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('session_control', 'session-control.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module._normalize_happ_subscription_title('base64:RWRnZSBWUE4=') == 'Edge VPN'
          assert module._normalize_happ_subscription_title('BASE64:RWRnZSBWUE4=') == 'Edge VPN'
          assert module._normalize_happ_subscription_title('RWRnZSBWUE4=') == 'Edge VPN'
          assert module._normalize_happ_subscription_title('My VPN') == 'My VPN'
          assert module._normalize_happ_subscription_title('base64:not-valid-%%%') == ''
          PY
          git diff --check
      - name: Clean temporary machinery and push
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/gemini-dispatch.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = '\n# TEMP_HAPP_TITLE_FIX_START\n'
          end_marker = '# TEMP_HAPP_TITLE_FIX_END\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          path.write_text((text[:start] + '\n' + text[end:]).rstrip('\n') + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/fix-happ-subscription-title-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Decode Happ subscription display names'
          git push origin HEAD:main
# TEMP_HAPP_TITLE_FIX_END
