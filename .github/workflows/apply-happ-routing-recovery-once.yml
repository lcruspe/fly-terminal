name: Apply Happ routing recovery once

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >-
      (github.event_name == 'issues' && github.event.issue.title == 'Trigger: apply Happ routing recovery') ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 14 && github.event.comment.body == '@apply-happ-routing-recovery')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply implementation
        run: python tools/_apply_happ_routing_recovery_once.py

      - name: Validate Python and JavaScript
        run: |
          python -m py_compile session-control.py
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('inline script not found')
          Path('/tmp/fly-terminal-index.js').write_text(html[start + len('<script>'):end], encoding='utf-8')
          PY
          node --check /tmp/fly-terminal-index.js
          git diff --check

      - name: Validate Happ routing recovery contract
        run: |
          python - <<'PY'
          import importlib.util
          import plistlib
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('fly_session_control', Path('session-control.py'))
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert module._normalize_happ_routing_deeplink('happ://routing/off') == 'happ://routing/off'
          assert module._normalize_happ_routing_deeplink('happ://routing/onadd/abc==') == 'happ://routing/onadd/abc=='
          assert module._normalize_happ_routing_deeplink('https://example.com/profile') == ''
          archive = plistlib.dumps({'routing': 'happ://routing/onadd/abc'})
          assert module._happ_subscription_routing_deeplink(archive) == 'happ://routing/onadd/abc'
          archive_off = plistlib.dumps({'routing-enable': '0'})
          assert module._happ_subscription_routing_deeplink(archive_off) == 'happ://routing/off'

          deeplinks = []
          restarts = iter([(False, 'xray routing failed'), (True, '')])
          module._write_happ_current_config = lambda location: (True, '')
          module.run_happ_routing_deeplink = lambda value: (deeplinks.append(value) is None, '')
          module.restart_happ_vpn = lambda: next(restarts)
          module.happ_current_location = lambda: 'Edge location'
          ok, error, fallback = module.apply_happ_location(
              {'routingDeeplink': 'happ://routing/onadd/abc'},
              {'label': 'Edge location', 'config': {'outbounds': []}},
          )
          assert ok is True and error == '' and fallback is True
          assert deeplinks == ['happ://routing/onadd/abc', 'happ://routing/off']
          PY
          grep -q 'routingFallback' session-control.py
          grep -q 'без маршрутизации' index.html
          grep -q 'Маршрутизация подписки и восстановление Xray' TOOLS.md

      - name: Clean one-shot files and push
        run: |
          rm tools/_apply_happ_routing_recovery_once.py
          rm .github/workflows/apply-happ-routing-recovery-once.yml
          rm -f tools/.trigger-placeholder
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recover Happ routing failures automatically'
          git push origin HEAD:main

      - name: Close trigger issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
