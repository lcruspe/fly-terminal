name: Fix Happ subscription titles once

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.issue.title == 'Run Happ title patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and validate
        run: python tools/_fix_happ_subscription_title_once.py
      - name: Clean temporary files
        run: python tools/_cleanup_happ_title_fix_once.py
      - name: Commit implementation
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Decode Happ subscription display names'
          git push origin HEAD:main
