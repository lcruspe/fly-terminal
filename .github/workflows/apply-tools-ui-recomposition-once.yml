name: Apply Tools UI recomposition once

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >-
      (github.event_name == 'issues' && github.event.issue.title == 'Trigger: apply Tools UI recomposition') ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 11 && github.event.comment.body == '@apply-tools-ui-recomposition')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply UI recomposition
        run: python tools/_apply_tools_ui_recomposition_once.py

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('inline script not found')
          Path('/tmp/fly-terminal-index.js').write_text(html[start + len('<script>'):end], encoding='utf-8')
          PY
          node --check /tmp/fly-terminal-index.js

      - name: Validate UI contract
        run: |
          grep -q 'Обмен файлами' index.html
          grep -q 'На виртуальную машину' index.html
          grep -q 'На локальный компьютер' index.html
          grep -q 'Файлы виртуальной машины' index.html
          grep -q 'containerFileCurrentPath = "/config"' index.html
          grep -q '## Компоновка интерфейса Tools' TOOLS.md
          git diff --check

      - name: Clean one-shot files and push
        run: |
          rm tools/_apply_tools_ui_recomposition_once.py
          rm .github/workflows/apply-tools-ui-recomposition-once.yml
          rm -f .github/workflows/implement-file-tools-comment.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recompose Tools interface'
          git push origin HEAD:main

      - name: Close trigger issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
