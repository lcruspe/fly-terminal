<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>macOS Remote Desktop (H.264 / WebRTC)</title>
  <style>
    :root {
      --bg: #121417;
      --fg: #e2e8f0;
      --panel-bg: rgba(24, 28, 35, 0.85);
      --panel-border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --badge-ok-bg: rgba(16, 185, 129, 0.2);
      --badge-ok-fg: #34d399;
      --badge-warn-bg: rgba(245, 158, 11, 0.2);
      --badge-warn-fg: #fbbf24;
      --badge-err-bg: rgba(239, 68, 68, 0.2);
      --badge-err-fg: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--fg);
    }

    #viewport {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
      cursor: default;
    }

    #screenCanvas {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      outline: none;
      display: block;
    }

    #hudDock {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      max-width: calc(100% - 16px);
      pointer-events: none;
    }

    #hudChip {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border: 1px solid var(--panel-border);
      border-radius: 9999px;
      background: rgba(24, 28, 35, 0.68);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.28);
      color: var(--fg);
      font: inherit;
      font-size: 10px;
      cursor: pointer;
      opacity: 0.72;
      pointer-events: auto;
      transition: opacity 0.18s ease, background 0.18s ease;
    }

    #hudChip:hover,
    #hudChip:focus-visible {
      opacity: 1;
      background: rgba(24, 28, 35, 0.9);
      outline: none;
    }

    .hud-chip-status {
      color: var(--badge-ok-fg);
      font-weight: 700;
    }

    .hud-chip-status.warn {
      color: var(--badge-warn-fg);
    }

    .hud-chip-status.error {
      color: var(--badge-err-fg);
    }

    .hud-chip-separator {
      opacity: 0.35;
    }

    #hudBar {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      max-width: calc(100vw - 16px);
      padding: 6px 8px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
    }

    #hudDock.expanded #hudChip,
    #hudDock.pinned #hudChip {
      display: none;
    }

    #hudDock.expanded #hudBar,
    #hudDock.pinned #hudBar {
      display: flex;
    }

    .hud-icon-btn {
      min-width: 28px;
      justify-content: center;
      padding-inline: 6px;
    }

    #hudDragHandle {
      cursor: grab;
      touch-action: none;
    }

    #hudDragHandle:active {
      cursor: grabbing;
    }

    #hudPinBtn.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.5);
      color: #7dd3fc;
    }

    .hud-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.3px;
      font-feature-settings: "tnum";
    }

    .badge-status {
      background: var(--badge-ok-bg);
      color: var(--badge-ok-fg);
    }

    .badge-status.warn {
      background: var(--badge-warn-bg);
      color: var(--badge-warn-fg);
    }

    .badge-status.error {
      background: var(--badge-err-bg);
      color: var(--badge-err-fg);
    }

    .badge-fps {
      background: rgba(255, 255, 255, 0.08);
      color: #93c5fd;
    }

    .badge-res {
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      font-size: 10px;
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--fg);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, border-color 0.15s;
    }

    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .hud-btn:active {
      transform: scale(0.97);
    }

    .hud-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 2px;
    }

    #overlayMessage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px 32px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      z-index: 200;
      text-align: center;
    }

    #overlayMessage.hidden {
      display: none;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #clipboardModal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 90%;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      z-index: 300;
    }

    #clipboardModal.hidden {
      display: none;
    }

    #clipboardText {
      width: 100%;
      height: 100px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: var(--fg);
      padding: 10px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      outline: none;
    }

    #clipboardText:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <canvas id="screenCanvas" tabindex="0"></canvas>

    <div id="hudDock">
      <button type="button" id="hudChip" title="Показать управление Remote Desktop" aria-label="Показать управление Remote Desktop">
        <span class="hud-chip-status" id="hudChipStatus">H.264</span>
        <span class="hud-chip-separator">·</span>
        <span id="hudChipFps">60 fps</span>
        <span class="hud-chip-separator">·</span>
        <span id="hudChipRes">1920×1080</span>
      </button>
      <div id="hudBar" role="toolbar" aria-label="Управление Remote Desktop">
        <button type="button" class="hud-btn hud-icon-btn" id="hudDragHandle" title="Перетащить панель" aria-label="Перетащить панель">⠿</button>
        <span class="hud-badge badge-status" id="statusBadge">60 FPS H.264</span>
        <span class="hud-badge badge-fps" id="fpsBadge">60 fps</span>
        <span class="hud-badge badge-res" id="resBadge">1920×1080</span>
        <div class="hud-divider"></div>
        <button type="button" class="hud-btn" id="spotlightBtn" title="Spotlight (Cmd+Пробел)">⌘ Space</button>
        <button type="button" class="hud-btn" id="appSwitcherBtn" title="Переключение окон (Cmd+Tab)">⌘ Tab</button>
        <button type="button" class="hud-btn" id="pasteBtn" title="Вставить текст в Mac">Вставка</button>
        <div class="hud-divider"></div>
        <button type="button" class="hud-btn" id="scaleModeBtn" title="Режим масштабирования">Fit</button>
        <button type="button" class="hud-btn hud-icon-btn" id="fullscreenBtn" title="Во весь экран" aria-label="Во весь экран">⛶</button>
        <button type="button" class="hud-btn hud-icon-btn" id="hudPinBtn" title="Закрепить панель" aria-label="Закрепить панель" aria-pressed="false">📌</button>
        <button type="button" class="hud-btn hud-icon-btn" id="hudCollapseBtn" title="Свернуть панель" aria-label="Свернуть панель">⌃</button>
      </div>
    </div>

    <div id="overlayMessage">
      <div class="spinner" id="overlaySpinner"></div>
      <h3 id="overlayTitle">Подключение к macOS...</h3>
      <p id="overlaySubtext" style="font-size: 13px; color: #94a3b8;">Инициализация H.264 видеопотока...</p>
      <button type="button" class="hud-btn" id="reconnectBtn" style="margin-top: 8px; display: none;">Повторить попытку</button>
    </div>

    <div id="clipboardModal" class="hidden">
      <h4 style="font-size: 14px; font-weight: 600;">Вставка текста в macOS</h4>
      <textarea id="clipboardText" placeholder="Введите или вставьте текст..."></textarea>
      <div class="modal-actions">
        <button type="button" class="hud-btn" id="clipboardCancelBtn">Отмена</button>
        <button type="button" class="hud-btn" id="clipboardSendBtn" style="background: var(--accent); color: #000; font-weight: 600;">Отправить в Mac</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const wsPath = urlParams.get("path") || "desktop-stream-ws";
      const requestedResolution = /^(1280x720|1600x900|1920x1080|2560x1440)$/.test(urlParams.get("resolution") || "")
        ? urlParams.get("resolution") : "1920x1080";
      const [requestedWidth, requestedHeight] = requestedResolution.split("x").map(Number);
      const requestedFps = [15, 30, 45, 60].includes(Number(urlParams.get("fps"))) ? Number(urlParams.get("fps")) : 60;
      const displayParam = urlParams.get("display") || "";
      const requestedDisplayName = ["Fly Remote", "Fly Browser"].includes(displayParam) ? displayParam : "";
      const requestedScaleMode = ["contain", "fill", "sync"].includes(urlParams.get("scale"))
        ? urlParams.get("scale") : "contain";
      
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const host = window.location.host;
      let wsUrl = `${protocol}//${host}/${wsPath.replace(/^\//, "")}`;
      if (urlParams.get("port")) {
        wsUrl = `${protocol}//${window.location.hostname}:${urlParams.get("port")}/`;
      }

      const canvas = document.getElementById("screenCanvas");
      const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
      const statusBadge = document.getElementById("statusBadge");
      const fpsBadge = document.getElementById("fpsBadge");
      const resBadge = document.getElementById("resBadge");
      const overlay = document.getElementById("overlayMessage");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlaySubtext = document.getElementById("overlaySubtext");
      const reconnectBtn = document.getElementById("reconnectBtn");
      const clipboardModal = document.getElementById("clipboardModal");
      const clipboardText = document.getElementById("clipboardText");
      const viewport = document.getElementById("viewport");
      const hudDock = document.getElementById("hudDock");
      const hudBar = document.getElementById("hudBar");
      const hudChip = document.getElementById("hudChip");
      const hudChipStatus = document.getElementById("hudChipStatus");
      const hudChipFps = document.getElementById("hudChipFps");
      const hudChipRes = document.getElementById("hudChipRes");
      const hudDragHandle = document.getElementById("hudDragHandle");
      const hudPinBtn = document.getElementById("hudPinBtn");
      const hudCollapseBtn = document.getElementById("hudCollapseBtn");
      const HUD_AUTOHIDE_MS = 3000;
      const HUD_PIN_KEY = "flyRemoteHudPinned";
      const HUD_POSITION_KEY = "flyRemoteHudPosition";
      let hudCollapseTimer = null;
      let hudPinned = false;
      let hudDragging = false;

      function safeStorageGet(key) {
        try { return localStorage.getItem(key); } catch (_) { return null; }
      }

      function safeStorageSet(key, value) {
        try { localStorage.setItem(key, value); } catch (_) {}
      }

      function clampHudPosition() {
        const maxX = Math.max(8, viewport.clientWidth - hudDock.offsetWidth - 8);
        const maxY = Math.max(8, viewport.clientHeight - hudDock.offsetHeight - 8);
        const currentX = Number.parseFloat(hudDock.style.left || "12");
        const currentY = Number.parseFloat(hudDock.style.top || "12");
        hudDock.style.left = `${Math.min(maxX, Math.max(8, currentX))}px`;
        hudDock.style.top = `${Math.min(maxY, Math.max(8, currentY))}px`;
      }

      function saveHudPosition() {
        safeStorageSet(HUD_POSITION_KEY, JSON.stringify({
          x: Number.parseFloat(hudDock.style.left || "12"),
          y: Number.parseFloat(hudDock.style.top || "12")
        }));
      }

      function restoreHudPosition() {
        try {
          const saved = JSON.parse(safeStorageGet(HUD_POSITION_KEY) || "null");
          if (saved && Number.isFinite(saved.x) && Number.isFinite(saved.y)) {
            hudDock.style.left = `${saved.x}px`;
            hudDock.style.top = `${saved.y}px`;
          }
        } catch (_) {}
        requestAnimationFrame(clampHudPosition);
      }

      function clearHudCollapseTimer() {
        clearTimeout(hudCollapseTimer);
        hudCollapseTimer = null;
      }

      function setHudExpanded(expanded) {
        if (hudPinned) expanded = true;
        hudDock.classList.toggle("expanded", expanded);
        if (expanded) requestAnimationFrame(clampHudPosition);
      }

      function scheduleHudCollapse() {
        clearHudCollapseTimer();
        if (hudPinned || hudDragging || !hudDock.classList.contains("expanded")) return;
        hudCollapseTimer = setTimeout(() => setHudExpanded(false), HUD_AUTOHIDE_MS);
      }

      function revealHud() {
        setHudExpanded(true);
        scheduleHudCollapse();
      }

      function setHudPinned(pinned) {
        hudPinned = Boolean(pinned);
        hudDock.classList.toggle("pinned", hudPinned);
        hudPinBtn.classList.toggle("active", hudPinned);
        hudPinBtn.setAttribute("aria-pressed", hudPinned ? "true" : "false");
        hudPinBtn.title = hudPinned ? "Открепить панель" : "Закрепить панель";
        safeStorageSet(HUD_PIN_KEY, hudPinned ? "1" : "0");
        if (hudPinned) {
          clearHudCollapseTimer();
          setHudExpanded(true);
        } else {
          scheduleHudCollapse();
        }
      }

      function syncHudChip() {
        const statusText = statusBadge.textContent.trim();
        let compactStatus = "H.264";
        if (statusBadge.classList.contains("error")) compactStatus = "Ошибка";
        else if (statusText.includes("заблокирован")) compactStatus = "Блокировка";
        else if (statusText.includes("Подключение")) compactStatus = "Подключение";
        else if (statusText.includes("Отключено")) compactStatus = "Отключено";
        else if (statusText.includes("разрешен") || statusText.includes("Разрешен")) compactStatus = "Разрешение";
        hudChipStatus.textContent = compactStatus;
        hudChipStatus.classList.toggle("warn", statusBadge.classList.contains("warn"));
        hudChipStatus.classList.toggle("error", statusBadge.classList.contains("error"));
        hudChipFps.textContent = fpsBadge.textContent.trim();
        hudChipRes.textContent = resBadge.textContent.trim();
      }

      const hudStatusObserver = new MutationObserver(syncHudChip);
      [statusBadge, fpsBadge, resBadge].forEach((element) => hudStatusObserver.observe(element, {
        subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["class"]
      }));

      hudChip.addEventListener("mouseenter", revealHud);
      hudChip.addEventListener("click", revealHud);
      hudBar.addEventListener("pointermove", scheduleHudCollapse);
      hudBar.addEventListener("mouseleave", scheduleHudCollapse);
      hudBar.addEventListener("pointerdown", clearHudCollapseTimer);
      hudBar.addEventListener("click", scheduleHudCollapse);
      hudBar.addEventListener("focusin", clearHudCollapseTimer);
      hudBar.addEventListener("focusout", scheduleHudCollapse);
      hudPinBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        setHudPinned(!hudPinned);
      });
      hudCollapseBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        if (hudPinned) setHudPinned(false);
        clearHudCollapseTimer();
        setHudExpanded(false);
      });
      viewport.addEventListener("pointerdown", (event) => {
        if (!hudPinned && !hudDock.contains(event.target)) {
          clearHudCollapseTimer();
          setHudExpanded(false);
        }
      });

      hudDragHandle.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        event.stopPropagation();
        hudDragging = true;
        clearHudCollapseTimer();
        hudDragHandle.setPointerCapture(event.pointerId);
        const dockRect = hudDock.getBoundingClientRect();
        const viewportRect = viewport.getBoundingClientRect();
        const offsetX = event.clientX - dockRect.left;
        const offsetY = event.clientY - dockRect.top;

        const move = (moveEvent) => {
          if (!hudDragging) return;
          const x = moveEvent.clientX - viewportRect.left - offsetX;
          const y = moveEvent.clientY - viewportRect.top - offsetY;
          const maxX = Math.max(8, viewport.clientWidth - hudDock.offsetWidth - 8);
          const maxY = Math.max(8, viewport.clientHeight - hudDock.offsetHeight - 8);
          hudDock.style.left = `${Math.min(maxX, Math.max(8, x))}px`;
          hudDock.style.top = `${Math.min(maxY, Math.max(8, y))}px`;
        };
        const finish = () => {
          if (!hudDragging) return;
          hudDragging = false;
          hudDragHandle.removeEventListener("pointermove", move);
          hudDragHandle.removeEventListener("pointerup", finish);
          hudDragHandle.removeEventListener("pointercancel", finish);
          saveHudPosition();
          scheduleHudCollapse();
        };
        hudDragHandle.addEventListener("pointermove", move);
        hudDragHandle.addEventListener("pointerup", finish);
        hudDragHandle.addEventListener("pointercancel", finish);
      });

      window.addEventListener("resize", () => requestAnimationFrame(clampHudPosition));
      hudPinned = safeStorageGet(HUD_PIN_KEY) === "1";
      restoreHudPosition();
      setHudPinned(hudPinned);
      syncHudChip();

      window.flyOpenKeyboard = () => {
        clipboardModal.classList.remove("hidden");
        clipboardText.value = "";
        clipboardText.focus({ preventScroll: true });
        return document.activeElement === clipboardText;
      };

      let socket = null;
      let decoder = null;
      let isDecoderReady = false;
      let frameCount = 0;
      let lastFpsTime = performance.now();
      let streamWidth = 1920;
      let streamHeight = 1080;
      let macScreenWidth = 2560;
      let macScreenHeight = 1440;
      let serverPixelWidth = 2560;
      let serverPixelHeight = 1440;
      let fitMode = requestedScaleMode; // "contain", "fill" or "sync"
      let syncConfigureTimer = null;
      let reconnectAttempts = 0;
      let decodedFrameSeen = false;
      let decoderWatchdog = null;
      let decoderFallbackTriggered = false;
      let activeCodec = "";
      let pendingVideoPackets = [];
      const NO_VNC_URL = "/desktop/vnc.html?path=desktop-ws&autoconnect=true&resize=scale&quality=4&compression=9&show_dot=true";

      function updateOverlay(show, title, subtext, showButton = false) {
        if (show) {
          overlay.classList.remove("hidden");
          overlayTitle.textContent = title;
          overlaySubtext.textContent = subtext;
          reconnectBtn.style.display = showButton ? "inline-flex" : "none";
          document.getElementById("overlaySpinner").style.display = showButton ? "none" : "block";
        } else {
          overlay.classList.add("hidden");
        }
      }

      function showPermissionPrompt(msgText) {
        overlay.classList.remove("hidden");
        document.getElementById("overlaySpinner").style.display = "none";
        overlayTitle.textContent = "Требуется разрешение macOS";
        overlaySubtext.innerHTML = `
          ${msgText || "Требуется включить Запись экрана для fly-mac-encoder."}<br><br>
          Откройте <strong>Системные настройки → Конфиденциальность → Запись экрана</strong> и включите <strong>fly-mac-encoder</strong>.
          <div style="display: flex; gap: 8px; justify-content: center; margin-top: 12px;">
            <button type="button" class="hud-btn" id="openSettingsBtn" style="background: var(--accent); color: #000; font-weight: 600;">Открыть настройки Mac</button>
            <button type="button" class="hud-btn" id="fallbackVncBtn">Переключить на noVNC</button>
          </div>
        `;
        const openBtn = document.getElementById("openSettingsBtn");
        if (openBtn) {
          openBtn.onclick = () => {
            fetch("/api/mac/open-permissions", { method: "POST" }).catch(() => {});
          };
        }
        const vncBtn = document.getElementById("fallbackVncBtn");
        if (vncBtn) {
          vncBtn.onclick = () => {
            window.location.href = NO_VNC_URL;
          };
        }
      }

      function fallbackFromH264(reason) {
        if (decoderFallbackTriggered) return;
        decoderFallbackTriggered = true;
        clearTimeout(decoderWatchdog);
        console.warn("H.264 stream fallback:", reason);
        try { socket?.close(); } catch (_) {}

        if (requestedDisplayName === "Fly Browser") {
          if (window.parent !== window) {
            updateOverlay(true, "Нативный Browser недоступен", "Переключение на Chromium fallback...");
            window.parent.postMessage({ type: "fly-native-browser-unavailable", reason }, window.location.origin);
            return;
          }
          window.location.replace("/browser/");
          return;
        }

        updateOverlay(true, "Совместимый режим", "H.264 недоступен в этом браузере. Переключение на noVNC...");
        window.location.replace(NO_VNC_URL);
      }

      function decodeVideoPacket(buffer) {
        if (!(buffer instanceof ArrayBuffer) || !isDecoderReady || !decoder) return false;
        const view = new DataView(buffer);
        if (view.byteLength < 10) return false;
        const flags = view.getUint8(0);
        const isKey = (flags & 0x01) !== 0;
        const tsMs = Number(view.getBigInt64(1));
        const naluData = new Uint8Array(buffer, 9);
        try {
          decoder.decode(new EncodedVideoChunk({
            type: isKey ? "key" : "delta",
            timestamp: tsMs * 1000,
            data: naluData
          }));
          return true;
        } catch (decErr) {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: "keyframe" }));
          }
          return false;
        }
      }

      async function initVideoDecoder(codec) {
        if (!("VideoDecoder" in window) || !("EncodedVideoChunk" in window)) {
          fallbackFromH264("webcodecs_unavailable");
          return false;
        }
        const normalizedCodec = /^avc1\.[0-9A-Fa-f]{6}$/.test(codec || "") ? codec : "avc1.4D002A";
        if (decoder && isDecoderReady && activeCodec === normalizedCodec) return true;

        isDecoderReady = false;
        const config = { codec: normalizedCodec, optimizeForLatency: true };
        try {
          if (typeof VideoDecoder.isConfigSupported === "function") {
            const support = await VideoDecoder.isConfigSupported(config);
            if (!support.supported) {
              fallbackFromH264(`h264_unsupported:${normalizedCodec}`);
              return false;
            }
          }

          try { decoder?.close(); } catch (_) {}
          decoder = new VideoDecoder({
            output: (frame) => {
              decodedFrameSeen = true;
              clearTimeout(decoderWatchdog);
              if (canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) {
                canvas.width = frame.displayWidth;
                canvas.height = frame.displayHeight;
                resBadge.textContent = `${frame.displayWidth}×${frame.displayHeight}`;
              }
              try {
                ctx.drawImage(frame, 0, 0);
              } catch (drawErr) {
                frame.close();
                fallbackFromH264("canvas_draw_failed");
                return;
              }
              frame.close();

              frameCount++;
              const now = performance.now();
              if (now - lastFpsTime >= 1000) {
                const fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
                fpsBadge.textContent = `${fps} fps`;
                frameCount = 0;
                lastFpsTime = now;
              }
            },
            error: (err) => {
              console.error("VideoDecoder error:", err);
              statusBadge.textContent = "Ошибка декодера";
              statusBadge.className = "hud-badge badge-status error";
              fallbackFromH264("decoder_error");
            }
          });

          decoder.configure(config);
          activeCodec = normalizedCodec;
          isDecoderReady = true;
          const queued = pendingVideoPackets.splice(0);
          queued.forEach(decodeVideoPacket);
          return true;
        } catch (e) {
          console.error("Failed to initialize WebCodecs VideoDecoder:", e);
          fallbackFromH264("decoder_init_failed");
          return false;
        }
      }

      async function connect() {
        updateOverlay(true, "Подключение к macOS...", "Установка WebSocket H.264 соединения...");
        statusBadge.textContent = "Подключение...";
        statusBadge.className = "hud-badge badge-status warn";

        try {
          socket = new WebSocket(wsUrl);
          socket.binaryType = "arraybuffer";

          socket.onopen = () => {
            reconnectAttempts = 0;
            decodedFrameSeen = false;
            updateOverlay(false);
            statusBadge.textContent = "60 FPS H.264";
            statusBadge.className = "hud-badge badge-status";
            configureStream();
            clearTimeout(decoderWatchdog);
            decoderWatchdog = setTimeout(() => {
              if (!decodedFrameSeen) fallbackFromH264("no_decoded_frames");
            }, 4000);
          };

          socket.onmessage = async (event) => {
            if (typeof event.data === "string") {
              try {
                const msg = JSON.parse(event.data);
                if (msg.type === "init") {
                  if (!await initVideoDecoder(msg.codec || activeCodec)) return;
                  streamWidth = msg.width || streamWidth;
                  streamHeight = msg.height || streamHeight;
                  macScreenWidth = msg.screenWidth || macScreenWidth;
                  macScreenHeight = msg.screenHeight || macScreenHeight;
                  serverPixelWidth = msg.pixelWidth || serverPixelWidth;
                  serverPixelHeight = msg.pixelHeight || serverPixelHeight;
                  resBadge.textContent = `${streamWidth}×${streamHeight}`;
                  if (msg.screenLocked) {
                    statusBadge.textContent = "Mac заблокирован";
                    statusBadge.className = "hud-badge badge-status warn";
                  }
                  scheduleSyncConfigure();
                } else if (msg.type === "codec") {
                  await initVideoDecoder(msg.codec || activeCodec);
                } else if (msg.type === "display") {
                  macScreenWidth = msg.screenWidth || macScreenWidth;
                  macScreenHeight = msg.screenHeight || macScreenHeight;
                  serverPixelWidth = msg.pixelWidth || serverPixelWidth;
                  serverPixelHeight = msg.pixelHeight || serverPixelHeight;
                  scheduleSyncConfigure();
                } else if (msg.type === "status") {
                  if (msg.state === "tcc_required") {
                    statusBadge.textContent = "Требуется разрешение";
                    statusBadge.className = "hud-badge badge-status warn";
                    showPermissionPrompt(msg.message);
                    if (requestedDisplayName === "Fly Browser" && window.parent !== window) {
                      window.parent.postMessage({ type: "fly-native-browser-unavailable", reason: "tcc_required" }, window.location.origin);
                    }
                  } else if (msg.state === "host_locked") {
                    updateOverlay(false);
                    statusBadge.textContent = "Mac заблокирован";
                    statusBadge.className = "hud-badge badge-status warn";
                  } else if (msg.state === "host_unlocked" || msg.state === "capturing") {
                    updateOverlay(false);
                    statusBadge.textContent = "60 FPS H.264";
                    statusBadge.className = "hud-badge badge-status";
                  }
                }
              } catch (e) {}
              return;
            }

            if (event.data instanceof ArrayBuffer) {
              if (!isDecoderReady) {
                if (pendingVideoPackets.length >= 8) pendingVideoPackets.shift();
                pendingVideoPackets.push(event.data);
                return;
              }
              decodeVideoPacket(event.data);
            }
          };

          socket.onclose = (event) => {
            clearTimeout(decoderWatchdog);
            if (decoderFallbackTriggered) return;
            statusBadge.textContent = "Отключено";
            statusBadge.className = "hud-badge badge-status warn";
            if (event.code === 4000) {
              reconnectAttempts = 0;
              updateOverlay(true, "Сеанс отключён", "5 минут бездействия. Нажмите «Повторить попытку», чтобы подключиться снова.", true);
              return;
            }
            reconnectAttempts++;
            const delay = Math.min(5000, 1000 * Math.pow(1.5, reconnectAttempts));
            updateOverlay(true, "Соединение разорвано", `Повторное подключение через ${(delay/1000).toFixed(1)} с...`, true);
            setTimeout(() => {
              if (!socket || socket.readyState === WebSocket.CLOSED) {
                connect();
              }
            }, delay);
          };

          socket.onerror = () => {
            statusBadge.textContent = "Ошибка связи";
            statusBadge.className = "hud-badge badge-status error";
          };
        } catch (err) {
          updateOverlay(true, "Ошибка подключения", String(err), true);
        }
      }

      function configureStream(force = false) {
        if (socket && socket.readyState === WebSocket.OPEN) {
          const syncWidth = Math.max(640, Math.min(7680, Math.floor(serverPixelWidth / 2) * 2));
          const syncHeight = Math.max(360, Math.min(4320, Math.floor(serverPixelHeight / 2) * 2));
          socket.send(JSON.stringify({
            type: "configure",
            width: fitMode === "sync" ? syncWidth : requestedWidth,
            height: fitMode === "sync" ? syncHeight : requestedHeight,
            fps: requestedFps,
            displayName: requestedDisplayName,
            force
          }));
        }
      }

      function scheduleSyncConfigure() {
        if (fitMode !== "sync" || streamWidth === serverPixelWidth && streamHeight === serverPixelHeight) return;
        clearTimeout(syncConfigureTimer);
        syncConfigureTimer = setTimeout(() => configureStream(), 120);
      }

      function applyFitMode() {
        const button = document.getElementById("scaleModeBtn");
        const sync = fitMode === "sync";
        canvas.style.objectFit = fitMode === "fill" ? "fill" : "contain";
        button.textContent = sync ? "Sync" : (fitMode === "fill" ? "Fill" : "Fit");
        button.title = sync
          ? `Sync: поток ${serverPixelWidth}×${serverPixelHeight}, пропорции без растяжения`
          : (fitMode === "fill" ? "Fill: растянуть на всё окно" : "Fit: вписать в окно");
      }
      window.flyConfigureStream = configureStream;

      // MARK: - Mouse & Keyboard Event Forwarding

      let mouseMoveRaf = null;
      let lastPendingMousePos = null;

      function getRenderedScreenRect() {
        const rect = canvas.getBoundingClientRect();
        if (fitMode === "fill" || !streamWidth || !streamHeight) return rect;

        const scale = Math.min(rect.width / streamWidth, rect.height / streamHeight);
        const width = streamWidth * scale;
        const height = streamHeight * scale;
        return {
          left: rect.left + (rect.width - width) / 2,
          top: rect.top + (rect.height - height) / 2,
          width,
          height
        };
      }

      function getNormalizedCoords(e) {
        const rect = getRenderedScreenRect();
        const normX = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const normY = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
        return { x: normX, y: normY };
      }

      canvas.addEventListener("mousemove", (e) => {
        const coords = getNormalizedCoords(e);
        lastPendingMousePos = coords;
        if (!mouseMoveRaf) {
          mouseMoveRaf = requestAnimationFrame(() => {
            if (socket && socket.readyState === WebSocket.OPEN && lastPendingMousePos) {
              socket.send(JSON.stringify({
                type: "mousemove",
                x: lastPendingMousePos.x,
                y: lastPendingMousePos.y
              }));
            }
            mouseMoveRaf = null;
          });
        }
      });

      canvas.addEventListener("mousedown", (e) => {
        canvas.focus();
        e.preventDefault();
        const coords = getNormalizedCoords(e);
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({
            type: "mousedown",
            button: e.button,
            x: coords.x,
            y: coords.y
          }));
        }
      });

      canvas.addEventListener("mouseup", (e) => {
        e.preventDefault();
        const coords = getNormalizedCoords(e);
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({
            type: "mouseup",
            button: e.button,
            x: coords.x,
            y: coords.y
          }));
        }
      });

      canvas.addEventListener("contextmenu", (e) => {
        e.preventDefault();
      });

      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({
            type: "wheel",
            dx: -e.deltaX,
            dy: -e.deltaY
          }));
        }
      }, { passive: false });

      // Keyboard
      canvas.addEventListener("keydown", (e) => {
        // Allow F12 / DevTools
        if (e.key === "F12") return;
        e.preventDefault();
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({
            type: "keydown",
            code: e.code,
            key: e.key,
            modifiers: {
              meta: e.metaKey,
              ctrl: e.ctrlKey,
              alt: e.altKey,
              shift: e.shiftKey
            }
          }));
        }
      });

      canvas.addEventListener("keyup", (e) => {
        e.preventDefault();
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({
            type: "keyup",
            code: e.code,
            key: e.key,
            modifiers: {
              meta: e.metaKey,
              ctrl: e.ctrlKey,
              alt: e.altKey,
              shift: e.shiftKey
            }
          }));
        }
      });

      // Quick Toolbar actions
      document.getElementById("spotlightBtn").onclick = () => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: "keydown", code: "Space", key: " ", modifiers: { meta: true } }));
          setTimeout(() => {
            socket.send(JSON.stringify({ type: "keyup", code: "Space", key: " ", modifiers: { meta: true } }));
          }, 50);
        }
      };

      document.getElementById("appSwitcherBtn").onclick = () => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: "keydown", code: "Tab", key: "Tab", modifiers: { meta: true } }));
          setTimeout(() => {
            socket.send(JSON.stringify({ type: "keyup", code: "Tab", key: "Tab", modifiers: { meta: true } }));
          }, 50);
        }
      };

      document.getElementById("pasteBtn").onclick = async () => {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            if (text && socket && socket.readyState === WebSocket.OPEN) {
              socket.send(JSON.stringify({ type: "clipboard", text }));
              return;
            }
          }
        } catch (e) {}
        window.flyOpenKeyboard();
      };

      document.getElementById("clipboardCancelBtn").onclick = () => {
        clipboardText.value = "";
        clipboardModal.classList.add("hidden");
      };

      document.getElementById("clipboardSendBtn").onclick = () => {
        const text = clipboardText.value;
        if (text && socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: "clipboard", text }));
        }
        clipboardText.value = "";
        clipboardModal.classList.add("hidden");
      };

      document.getElementById("scaleModeBtn").onclick = (e) => {
        if (fitMode === "contain") {
          fitMode = "fill";
        } else if (fitMode === "fill") {
          fitMode = "sync";
        } else {
          fitMode = "contain";
        }
        applyFitMode();
        configureStream();
        if (window.parent !== window) {
          window.parent.postMessage({ type: "fly-desktop-scale-mode", mode: fitMode }, window.location.origin);
        }
      };

      document.getElementById("fullscreenBtn").onclick = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      };

      reconnectBtn.onclick = () => {
        connect();
      };

      // Start
      applyFitMode();
      connect();
    })();
  </script>
</body>
</html>
