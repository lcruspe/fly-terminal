<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0e1116">
  <title>Вход • Fly Terminal</title>
  <link rel="stylesheet" href="/auth/login.css">
  <script src="/auth/login.js" defer></script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">FT</div>
    <h1>Fly Terminal</h1>
    <p class="subtitle">Вход в защищённый шлюз</p>
    <form id="login-form" autocomplete="on">
      <label for="username">Логин</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Войти</button>
      <p class="status" role="status" aria-live="polite"></p>
    </form>
    <p class="footnote">Сессия действует 30 дней с момента входа. Повторные посещения не продлевают её.</p>
  </main>
</body>
</html>
