<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Сервисы Mac mini</title>
  <link rel="stylesheet" href="/gateway.css">
</head>
<body>
  <main>
    <h1>Сервисы Mac mini</h1>
    <p>Для этой учётной записи доступен Sprut.Hub.</p>
    <section class="services">
      <a class="service" data-port="10000" href="#">
        <strong>Sprut.Hub</strong>
        <span>Локальный интерфейс Sprut.Hub через защищённый прокси Mac mini.</span>
        <span class="port">:10000</span>
      </a>
    </section>
    <p class="note">Если креды для порта 10000 ещё не находятся в кэше браузера, Basic Auth запросит их повторно.</p>
  </main>
  <script src="/gateway.js"></script>
</body>
</html>
