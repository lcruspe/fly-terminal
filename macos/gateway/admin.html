<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Сервисы Mac mini</title>
  <link rel="stylesheet" href="/gateway.css">
</head>
<body>
  <main>
    <h1>Сервисы Mac mini</h1>
    <section class="services">
      <a class="service" data-port="8443" href="#">
        <strong>Fly Terminal</strong>
        <span class="port">:8443</span>
      </a>
      <a class="service" data-port="8443" data-path="/desktop/webrtc.html?path=native-browser-stream-ws&amp;autoconnect=true&amp;resolution=1920x1080&amp;fps=60&amp;scale=contain&amp;display=Fly%20Browser" href="#">
        <strong>Remote Browser</strong>
        <span class="port">:8443 · native</span>
      </a>
      <a class="service" data-port="8443" data-path="/browser/" href="#">
        <strong>Chromium fallback</strong>
        <span class="port">:8443/browser/</span>
      </a>
      <a class="service" href="/yt-transcriber/">
        <strong>YT Transcript</strong>
        <span class="port">/yt-transcriber/</span>
      </a>
      <a class="service" data-port="10000" href="#">
        <strong>Sprut.Hub</strong>
        <span class="port">:10000</span>
      </a>
    </section>
  </main>
  <script src="/gateway.js"></script>
</body>
</html>
