<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal</title>
  <style>
    :root {
      --bg-start: #f8f0dd;
      --bg-end: #e3d4b9;
      --glow-a: rgba(198, 95, 47, 0.18);
      --glow-b: rgba(63, 111, 159, 0.14);
      --panel: rgba(255, 250, 239, 0.86);
      --panel-solid: rgba(255, 250, 239, 0.98);
      --control: rgba(255, 255, 255, 0.5);
      --control-strong: rgba(255, 255, 255, 0.78);
      --ink: #27221d;
      --muted: #766c60;
      --accent: #c65f2f;
      --border: rgba(67, 54, 41, 0.16);
      --focus: rgba(198, 95, 47, 0.45);
      --terminal-shell: #181511;
      --terminal-edge: rgba(39, 34, 29, 0.28);
      --shadow: 0 24px 80px rgba(63, 45, 25, 0.18);
      --panel-radius: 12px;
      --control-radius: 10px;
      --terminal-radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background:
        radial-gradient(circle at 12% 12%, var(--glow-a), transparent 34%),
        radial-gradient(circle at 86% 8%, var(--glow-b), transparent 28%),
        linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .shell {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      height: 100%;
      padding: 14px;
    }

    .toolbar {
      align-items: center;
      backdrop-filter: blur(20px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--panel-radius);
      box-shadow: var(--shadow);
      display: flex;
      gap: 12px;
      justify-content: space-between;
      overflow: visible;
      padding: 10px 12px 10px 16px;
      position: relative;
      z-index: 30;
    }

    .brand {
      min-width: 190px;
    }

    .brand strong {
      display: block;
      font-size: 15px;
      letter-spacing: 0.02em;
    }

    .brand span {
      color: var(--muted);
      display: block;
      font-size: 12px;
      margin-top: 2px;
    }

    .controls {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .settings {
      position: relative;
    }

    .settings summary {
      list-style: none;
    }

    .settings summary::-webkit-details-marker {
      display: none;
    }

    .settings summary::after {
      content: "▾";
      margin-left: 8px;
      font-size: 11px;
    }

    .settings[open] summary::after {
      content: "▴";
    }

    .settings-panel {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--panel-radius);
      box-shadow: 0 18px 44px rgba(63, 45, 25, 0.2);
      display: grid;
      gap: 14px;
      margin-top: 10px;
      padding: 14px;
      position: absolute;
      right: 0;
      top: calc(100% + 2px);
      width: min(420px, calc(100vw - 28px));
      z-index: 40;
    }

    .settings-group {
      display: grid;
      gap: 8px;
    }

    .settings-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .settings-note {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .theme-grid {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .theme-grid button {
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      justify-content: flex-start;
      min-height: 62px;
      padding: 10px 12px;
      text-align: left;
      width: 100%;
    }

    .theme-name {
      font-size: 13px;
      font-weight: 700;
    }

    .theme-mode {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .settings-row {
      align-items: center;
      display: grid;
      gap: 10px;
      grid-template-columns: 96px minmax(0, 1fr);
    }

    .settings-row label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    select {
      appearance: none;
      background:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%),
        rgba(255, 255, 255, 0.6);
      background-position:
        calc(100% - 16px) calc(50% + 1px),
        calc(100% - 10px) calc(50% + 1px),
        center;
      background-repeat: no-repeat;
      background-size: 6px 6px, 6px 6px, 100% 100%;
      border: 1px solid var(--border);
      border-radius: var(--control-radius);
      color: var(--ink);
      font: 600 13px/1.2 "Avenir Next", "Segoe UI", sans-serif;
      padding: 11px 36px 11px 12px;
      width: 100%;
    }

    select:focus,
    button:focus-visible,
    a.button:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    button,
    a.button,
    summary.button {
      appearance: none;
      background: var(--control);
      border: 1px solid var(--border);
      border-radius: var(--control-radius);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      font: 700 13px/1 "Avenir Next", "Segoe UI", sans-serif;
      padding: 10px 13px;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    button:hover,
    a.button:hover,
    summary.button:hover {
      background: var(--control-strong);
      transform: translateY(-1px);
    }

    button.active {
      background: var(--accent);
      border-color: transparent;
      color: #fff8eb;
    }

    .terminal {
      background: var(--terminal-shell);
      border: 1px solid var(--terminal-edge);
      border-radius: var(--terminal-radius);
      box-shadow: var(--shadow);
      min-height: 0;
      overflow: hidden;
      position: relative;
      z-index: 0;
    }

    iframe {
      background: var(--terminal-shell);
      border: 0;
      height: 100%;
      width: 100%;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
      }

      .shell {
        min-height: 100%;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
        border-radius: var(--panel-radius);
      }

      .controls {
        justify-content: flex-start;
      }

      .terminal {
        min-height: 70vh;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="toolbar" aria-label="Terminal settings">
      <div class="brand">
        <strong>Fly Terminal</strong>
        <span id="status">Тема сохраняется в этом браузере</span>
      </div>
      <div class="controls">
        <button type="button" id="copySelection">Скопировать</button>
        <a class="button" id="directLink" href="/terminal/" target="_blank" rel="noreferrer">В отдельном окне</a>
        <details class="settings">
          <summary class="button">Настройки</summary>
          <div class="settings-panel">
            <div class="settings-group">
              <span class="settings-label">Цветовая схема</span>
              <div class="theme-grid">
                <button type="button" data-theme="paper"></button>
                <button type="button" data-theme="linen"></button>
                <button type="button" data-theme="ledger"></button>
                <button type="button" data-theme="harbor"></button>
                <button type="button" data-theme="sage"></button>
                <button type="button" data-theme="graphite"></button>
                <button type="button" data-theme="ink"></button>
                <button type="button" data-theme="midnight"></button>
                <button type="button" data-theme="nord"></button>
                <button type="button" data-theme="forest"></button>
              </div>
              <span class="settings-note">Пять светлых и пять темных пресетов. Все палитры нейтральные и рассчитаны на рабочее использование.</span>
            </div>

            <div class="settings-row">
              <label for="fontSize">Размер текста</label>
              <select id="fontSize"></select>
            </div>

            <div class="settings-row">
              <label for="fontFamily">Шрифт</label>
              <select id="fontFamily"></select>
            </div>
          </div>
        </details>
      </div>
    </section>

    <section class="terminal" aria-label="Web terminal">
      <iframe id="terminalFrame" title="Web terminal" allow="clipboard-read; clipboard-write"></iframe>
    </section>
  </main>

          controlStrong: "rgba(255, 255, 255, 0.11)",
          ink: "#edf1f7",
          muted: "#b4bcc7",
          accent: "#88c0d0",
          border: "rgba(236, 239, 244, 0.12)",
          focus: "rgba(136, 192, 208, 0.34)",
          terminalShell: "#2b313b",
          terminalEdge: "rgba(236, 239, 244, 0.1)",
          shadow: "0 24px 80px rgba(0, 0, 0, 0.38)"
        },
        colors: {
          background: "#2e3440",
          foreground: "#eceff4",
          cursor: "#88c0d0",
          selectionBackground: "#4c566a",
          black: "#2e3440",
          red: "#bf616a",
          green: "#a3be8c",
          yellow: "#ebcb8b",
          blue: "#81a1c1",
          magenta: "#b48ead",
          cyan: "#88c0d0",
          white: "#eceff4",
          brightBlack: "#4c566a",
          brightRed: "#d08770",
          brightGreen: "#8fbcbb",
          brightYellow: "#ebcb8b",
          brightBlue: "#5e81ac",
          brightMagenta: "#b48ead",
          brightCyan: "#8fbcbb",
          brightWhite: "#f8fbff"
        }
      },
      forest: {
        label: "Forest",
        mode: "dark",
        shell: {
          bgStart: "#16231a",
          bgEnd: "#0d1510",
          glowA: "rgba(146, 209, 125, 0.12)",
          glowB: "rgba(112, 197, 183, 0.08)",
          panel: "rgba(20, 33, 23, 0.84)",
          panelSolid: "rgba(20, 33, 23, 0.98)",
          control: "rgba(255, 255, 255, 0.05)",
          controlStrong: "rgba(255, 255, 255, 0.11)",
          ink: "#ddebd4",
          muted: "#9db09a",
          accent: "#92d17d",
          border: "rgba(221, 235, 212, 0.1)",
          focus: "rgba(146, 209, 125, 0.34)",
          terminalShell: "#0f1d14",
          terminalEdge: "rgba(221, 235, 212, 0.08)",
          shadow: "0 24px 80px rgba(0, 0, 0, 0.4)"
        },
        colors: {
          background: "#112117",
          foreground: "#ddebd4",
          cursor: "#92d17d",
          selectionBackground: "#23402a",
          black: "#112117",
          red: "#d88478",
          green: "#92d17d",
          yellow: "#cfb667",
          blue: "#7aa8c8",
          magenta: "#a285ba",
          cyan: "#67b1a5",
          white: "#ddebd4",
          brightBlack: "#6e8470",
          brightRed: "#ea9a8f",
          brightGreen: "#ade094",
          brightYellow: "#e2c983",
          brightBlue: "#93bdd9",
          brightMagenta: "#b99bcf",
          brightCyan: "#83c9bc",
          brightWhite: "#f3f8ee"
        }
      }
    };

    const frame = document.getElementById("terminalFrame");
    const copySelectionButton = document.getElementById("copySelection");
    const directLink = document.getElementById("directLink");
    const status = document.getElementById("status");
    const buttons = Array.from(document.querySelectorAll("[data-theme]"));
    const fontSizeSelect = document.getElementById("fontSize");
    const fontFamilySelect = document.getElementById("fontFamily");
    const defaultFontFamily = fontFamilies[0].value;
    let statusResetTimer = null;

    const statusText = () => {
      const fontFamilyLabel = fontFamilies.find((family) => family.value === preferences.fontFamily)?.label || "Custom";
      const theme = themes[preferences.theme];
      return `${theme.label} (${theme.mode === "light" ? "light" : "dark"}), ${preferences.fontSize}px, ${fontFamilyLabel}. Сохранено для следующей сессии.`;
    };

    const setStatusText = (message, duration = 0) => {
      status.textContent = message;
      if (statusResetTimer) {
        clearTimeout(statusResetTimer);
        statusResetTimer = null;
      }
      if (duration > 0) {
        statusResetTimer = window.setTimeout(() => {
          status.textContent = statusText();
          statusResetTimer = null;
        }, duration);
      }
    };

    const normalizePreferences = (raw) => {
      const theme = themes[raw.theme] ? raw.theme : "paper";
      const fontSize = fontSizes.includes(Number(raw.fontSize)) ? Number(raw.fontSize) : 12;
      const fontFamily = fontFamilies.some((family) => family.value === raw.fontFamily) ? raw.fontFamily : defaultFontFamily;
      return { theme, fontSize, fontFamily };
    };

    const readPreferences = () => {
      try {
        return normalizePreferences(JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"));
      } catch {
        return { theme: "paper", fontSize: 12, fontFamily: defaultFontFamily };
      }
    };

    const readSessionId = () => {
      const existing = sessionStorage.getItem(SESSION_KEY);
      if (existing) {
        return existing;
      }

      const created = (crypto.randomUUID ? crypto.randomUUID() : `tab-${Date.now()}-${Math.random().toString(16).slice(2)}`).replace(/[^A-Za-z0-9._-]/g, "-");
      sessionStorage.setItem(SESSION_KEY, created);
      return created;
    };

    let preferences = readPreferences();
    const preset = new URLSearchParams(window.location.search).get("preset");
    if (preset && themes[preset]) {
      preferences.theme = preset;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(preferences));
      window.history.replaceState(null, "", window.location.pathname);
    }

    const buildTerminalUrl = () => {
      const theme = themes[preferences.theme] || themes.paper;
      const params = new URLSearchParams();
      params.set("arg", readSessionId());
      params.set("theme", JSON.stringify(theme.colors));
      params.set("fontSize", String(preferences.fontSize));
      params.set("fontFamily", preferences.fontFamily);
      params.set("cursorBlink", "true");
      params.set("disableLeaveAlert", "true");
      return `/terminal/?${params.toString()}`;
    };

    const applyShellTheme = () => {
      const theme = themes[preferences.theme] || themes.paper;
      const root = document.documentElement.style;
      root.setProperty("--bg-start", theme.shell.bgStart);
      root.setProperty("--bg-end", theme.shell.bgEnd);
      root.setProperty("--glow-a", theme.shell.glowA);
      root.setProperty("--glow-b", theme.shell.glowB);
      root.setProperty("--panel", theme.shell.panel);
      root.setProperty("--panel-solid", theme.shell.panelSolid);
      root.setProperty("--control", theme.shell.control);
      root.setProperty("--control-strong", theme.shell.controlStrong);
      root.setProperty("--ink", theme.shell.ink);
      root.setProperty("--muted", theme.shell.muted);
      root.setProperty("--accent", theme.shell.accent);
      root.setProperty("--border", theme.shell.border);
      root.setProperty("--focus", theme.shell.focus);
      root.setProperty("--terminal-shell", theme.shell.terminalShell);
      root.setProperty("--terminal-edge", theme.shell.terminalEdge);
      root.setProperty("--shadow", theme.shell.shadow);
    };

    const focusEmbeddedTerminal = () => {
      try {
        const textarea = frame.contentDocument?.querySelector(".xterm-helper-textarea");
        textarea?.focus({ preventScroll: true });
      } catch {
        // ignore cross-document or transient iframe states
      }
    };

    const getEmbeddedViewport = () => {
      try {
        return frame.contentDocument?.querySelector(".xterm-viewport") || null;
      } catch {
        return null;
      }
    };

    const getEmbeddedRowHeight = (doc) => {
      const sampleRow = doc?.querySelector(".xterm-rows > div");
      if (!sampleRow) {
        return 18;
      }

      const lineHeight = Number.parseFloat(getComputedStyle(sampleRow).lineHeight);
      return Number.isFinite(lineHeight) && lineHeight > 0 ? lineHeight : 18;
    };

    const getWheelPixels = (event, viewport) => {
      const doc = frame.contentDocument;
      let pixels = event.deltaY;
      if (event.deltaMode === WheelEvent.DOM_DELTA_LINE) {
        pixels *= getEmbeddedRowHeight(doc);
      } else if (event.deltaMode === WheelEvent.DOM_DELTA_PAGE) {
        pixels *= Math.max(viewport?.clientHeight || 0, getEmbeddedRowHeight(doc));
      }
      return pixels;
    };

    const handleEmbeddedWheel = (event) => {
      const viewport = getEmbeddedViewport();
      if (!viewport) {
        return;
      }

      const pixels = getWheelPixels(event, viewport);
      if (!pixels) {
        return;
      }

      focusEmbeddedTerminal();
      viewport.scrollTop += pixels;
      event.preventDefault();
      event.stopImmediatePropagation();
      event.stopPropagation();
    };

    const bindEmbeddedTermWheelHandler = (win) => {
      try {
        const term = win?.term;
        if (!term || typeof term.attachCustomWheelEventHandler !== "function") {
          return false;
        }

        if (term[FRAME_WHEEL_HANDLER_KEY]) {
          return true;
        }

        term[FRAME_WHEEL_HANDLER_KEY] = true;
        term.attachCustomWheelEventHandler((event) => {
          handleEmbeddedWheel(event);
          return false;
        });
        return true;
      } catch {
        return false;
      }
    };

    const scheduleEmbeddedTermWheelBinding = (win, attempt = 0) => {
      if (bindEmbeddedTermWheelHandler(win) || attempt >= 40) {
        return;
      }

      win.setTimeout(() => {
        scheduleEmbeddedTermWheelBinding(win, attempt + 1);
      }, 100);
    };

    const syncEmbeddedTerminal = () => {
      try {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        const theme = themes[preferences.theme] || themes.paper;
        if (!doc || !win) {
          return;
        }

        let styleTag = doc.getElementById(FRAME_STYLE_ID);
        if (!styleTag) {
          styleTag = doc.createElement("style");
          styleTag.id = FRAME_STYLE_ID;
          doc.head.appendChild(styleTag);
        }

        styleTag.textContent = `
          html, body {
            background: ${theme.colors.background} !important;
            overflow: hidden !important;
          }
          #terminal-container {
            width: 100% !important;
            max-width: none !important;
            height: 100% !important;
          }
          #terminal-container .terminal {
            height: 100% !important;
            padding: 0 !important;
            background: ${theme.colors.background} !important;
            border-radius: 0 !important;
          }
          .xterm,
          .xterm-screen,
          .xterm-viewport {
            background: ${theme.colors.background} !important;
          }
          .xterm-viewport {
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: ${theme.colors.brightBlack} ${theme.colors.background};
          }
        `;

        if (!win[FRAME_BINDING_KEY]) {
          win[FRAME_BINDING_KEY] = true;
          doc.addEventListener("pointerdown", focusEmbeddedTerminal, { passive: true });
          doc.addEventListener("mouseenter", focusEmbeddedTerminal, true);
        }

        scheduleEmbeddedTermWheelBinding(win);
      } catch {
        // ignore iframe sync failures and keep terminal usable
      }
    };

    fontSizes.forEach((size) => {
      const option = document.createElement("option");
      option.value = String(size);
      option.textContent = `${size}px`;
      fontSizeSelect.appendChild(option);
    });

    fontFamilies.forEach((family) => {
      const option = document.createElement("option");
      option.value = family.value;
      option.textContent = family.label;
      fontFamilySelect.appendChild(option);
    });

    buttons.forEach((button) => {
      const theme = themes[button.dataset.theme];
      if (!theme) {
        return;
      }
      const themeName = document.createElement("span");
      themeName.className = "theme-name";
      themeName.textContent = theme.label;
      const themeMode = document.createElement("span");
      themeMode.className = "theme-mode";
      themeMode.textContent = theme.mode === "light" ? "Light" : "Dark";
      button.append(themeName, themeMode);
    });

    const render = () => {
      applyShellTheme();
      const url = buildTerminalUrl();
      frame.src = url;
      directLink.href = url;
      buttons.forEach((button) => {
        button.classList.toggle("active", button.dataset.theme === preferences.theme);
      });
      fontSizeSelect.value = String(preferences.fontSize);
      fontFamilySelect.value = preferences.fontFamily;
      setStatusText(statusText());
    };

    const saveAndRender = () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(preferences));
      render();
    };

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        preferences.theme = button.dataset.theme;
        saveAndRender();
      });
    });

    fontSizeSelect.addEventListener("change", () => {
      const nextSize = Number(fontSizeSelect.value);
      if (!Number.isNaN(nextSize)) {
        preferences.fontSize = nextSize;
        saveAndRender();
      }
    });

    fontFamilySelect.addEventListener("change", () => {
      preferences.fontFamily = fontFamilySelect.value;
      saveAndRender();
    });

    const getFrameSelection = () => {
      try {
        return frame.contentWindow?.getSelection?.()?.toString() || "";
      } catch {
        return "";
      }
    };

    const copySelection = async () => {
      const selection = getFrameSelection().trim();
      if (!selection) {
        setStatusText("Сначала выдели текст в терминале.", 2200);
        return;
      }

      try {
        await navigator.clipboard.writeText(selection);
        setStatusText("Выделение скопировано.", 2200);
      } catch {
        try {
          frame.contentWindow?.document?.execCommand?.("copy");
          setStatusText("Выделение скопировано.", 2200);
        } catch {
          setStatusText("Браузер не дал доступ к буферу обмена.", 2600);
        }
      }
    };

    copySelectionButton.addEventListener("click", () => {
      copySelection();
    });

    window.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.shiftKey && event.key.toLowerCase() === "c") {
        event.preventDefault();
        copySelection();
      }
    });

    frame.addEventListener("load", () => {
      syncEmbeddedTerminal();
      focusEmbeddedTerminal();
    });

    render();
  </script>
</body>
</html>
