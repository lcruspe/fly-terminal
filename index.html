<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal</title>
  <style>
    :root {
      --bg: #e9dfca;
      --panel: rgba(255, 250, 239, 0.86);
      --ink: #27221d;
      --muted: #766c60;
      --accent: #c65f2f;
      --border: rgba(67, 54, 41, 0.16);
      --shadow: 0 24px 80px rgba(63, 45, 25, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background:
        radial-gradient(circle at 12% 12%, rgba(198, 95, 47, 0.18), transparent 34%),
        radial-gradient(circle at 86% 8%, rgba(63, 111, 159, 0.14), transparent 28%),
        linear-gradient(135deg, #f8f0dd 0%, #e3d4b9 100%);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .shell {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      height: 100%;
      padding: 14px;
    }

    .toolbar {
      align-items: center;
      backdrop-filter: blur(20px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      display: flex;
      gap: 12px;
      justify-content: space-between;
      overflow: visible;
      padding: 10px 12px 10px 16px;
      position: relative;
      z-index: 30;
    }

    .brand {
      min-width: 190px;
    }

    .brand strong {
      display: block;
      font-size: 15px;
      letter-spacing: 0.02em;
    }

    .brand span {
      color: var(--muted);
      display: block;
      font-size: 12px;
      margin-top: 2px;
    }

    .controls {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .settings {
      position: relative;
    }

    .settings summary {
      list-style: none;
    }

    .settings summary::-webkit-details-marker {
      display: none;
    }

    .settings summary::after {
      content: "▾";
      margin-left: 8px;
      font-size: 11px;
    }

    .settings[open] summary::after {
      content: "▴";
    }

    .settings-panel {
      background: rgba(255, 250, 239, 0.98);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 44px rgba(63, 45, 25, 0.2);
      display: grid;
      gap: 14px;
      margin-top: 10px;
      padding: 14px;
      position: absolute;
      right: 0;
      top: calc(100% + 2px);
      width: min(420px, calc(100vw - 28px));
      z-index: 40;
    }

    .settings-group {
      display: grid;
      gap: 8px;
    }

    .settings-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .theme-grid {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .theme-grid button {
      justify-content: center;
      width: 100%;
    }

    .settings-row {
      align-items: center;
      display: grid;
      gap: 10px;
      grid-template-columns: 96px minmax(0, 1fr);
    }

    .settings-row label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    select {
      appearance: none;
      background:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%),
        rgba(255, 255, 255, 0.6);
      background-position:
        calc(100% - 16px) calc(50% + 1px),
        calc(100% - 10px) calc(50% + 1px),
        center;
      background-repeat: no-repeat;
      background-size: 6px 6px, 6px 6px, 100% 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--ink);
      font: 600 13px/1.2 "Avenir Next", "Segoe UI", sans-serif;
      padding: 11px 36px 11px 12px;
      width: 100%;
    }

    select:focus,
    button:focus-visible,
    a.button:focus-visible,
    summary:focus-visible {
      outline: 2px solid rgba(198, 95, 47, 0.45);
      outline-offset: 2px;
    }

    button,
    a.button,
    summary.button {
      appearance: none;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      font: 700 13px/1 "Avenir Next", "Segoe UI", sans-serif;
      padding: 10px 13px;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    button:hover,
    a.button:hover,
    summary.button:hover {
      background: rgba(255, 255, 255, 0.78);
      transform: translateY(-1px);
    }

    button.active {
      background: var(--accent);
      border-color: transparent;
      color: #fff8eb;
    }

    .terminal {
      background: #181511;
      border: 1px solid rgba(39, 34, 29, 0.28);
      border-radius: 24px;
      box-shadow: var(--shadow);
      min-height: 0;
      overflow: hidden;
      position: relative;
      z-index: 0;
    }

    iframe {
      border: 0;
      height: 100%;
      width: 100%;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
      }

      .shell {
        min-height: 100%;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
        border-radius: 18px;
      }

      .controls {
        justify-content: flex-start;
      }

      .terminal {
        min-height: 70vh;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="toolbar" aria-label="Terminal settings">
      <div class="brand">
        <strong>Fly Terminal</strong>
        <span id="status">Тема сохраняется в этом браузере</span>
      </div>
      <div class="controls">
        <button type="button" id="copySelection">Скопировать</button>
        <a class="button" id="directLink" href="/terminal/" target="_blank" rel="noreferrer">В отдельном окне</a>
        <details class="settings">
          <summary class="button">Настройки</summary>
          <div class="settings-panel">
            <div class="settings-group">
              <span class="settings-label">Цветовая схема</span>
              <div class="theme-grid">
                <button type="button" data-theme="paper">Paper</button>
                <button type="button" data-theme="graphite">Graphite</button>
                <button type="button" data-theme="amber">Amber</button>
                <button type="button" data-theme="midnight">Midnight</button>
                <button type="button" data-theme="forest">Forest</button>
                <button type="button" data-theme="ocean">Ocean</button>
                <button type="button" data-theme="rose">Rose</button>
                <button type="button" data-theme="nord">Nord</button>
              </div>
            </div>

            <div class="settings-row">
              <label for="fontSize">Размер текста</label>
              <select id="fontSize"></select>
            </div>

            <div class="settings-row">
              <label for="fontFamily">Шрифт</label>
              <select id="fontFamily"></select>
            </div>
          </div>
        </details>
      </div>
    </section>

    <section class="terminal" aria-label="Web terminal">
      <iframe id="terminalFrame" title="Web terminal" allow="clipboard-read; clipboard-write"></iframe>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "fly-terminal-preferences-v1";
    const SESSION_KEY = "fly-terminal-session-id-v1";
    const fontFamilies = [
      { label: "Menlo", value: "Menlo, monospace" },
      { label: "Monaco", value: "Monaco, monospace" },
      { label: "Courier New", value: "Courier New, monospace" },
      { label: "Andale Mono", value: "Andale Mono, monospace" },
      { label: "Consolas", value: "Consolas, monospace" },
      { label: "SF Mono", value: "SFMono-Regular, SF Mono, Menlo, monospace" },
      { label: "Monospace", value: "monospace" }
    ];
    const fontSizes = [8, 9, 10, 11, 12, 13, 14];

    const themes = {
      paper: {
        label: "Paper",
        colors: {
          background: "#f7f3e8",
          foreground: "#28231f",
          cursor: "#c65f2f",
          selectionBackground: "#e7d6b3",
          black: "#28231f",
          red: "#b84d43",
          green: "#587a45",
          yellow: "#a9762c",
          blue: "#3f6f9f",
          magenta: "#8a5c8f",
          cyan: "#3f8585",
          white: "#f4ead8",
          brightBlack: "#6f665c",
          brightRed: "#d85f4f",
          brightGreen: "#6f934f",
          brightYellow: "#c89136",
          brightBlue: "#5688bf",
          brightMagenta: "#a775aa",
          brightCyan: "#56a0a0",
          brightWhite: "#fff8eb"
        }
      },
      graphite: {
        label: "Graphite",
        colors: {
          background: "#15171a",
          foreground: "#e6e0d4",
          cursor: "#f2b366",
          selectionBackground: "#343a40",
          black: "#15171a",
          red: "#e06c75",
          green: "#98c379",
          yellow: "#e5c07b",
          blue: "#61afef",
          magenta: "#c678dd",
          cyan: "#56b6c2",
          white: "#d7d1c7",
          brightBlack: "#6b7280",
          brightRed: "#ff7b86",
          brightGreen: "#b5e890",
          brightYellow: "#ffd28a",
          brightBlue: "#7cc7ff",
          brightMagenta: "#de8cff",
          brightCyan: "#71d7e3",
          brightWhite: "#fff7e8"
        }
      },
      amber: {
        label: "Amber",
        colors: {
          background: "#22170c",
          foreground: "#f7d79a",
          cursor: "#ffb547",
          selectionBackground: "#59401d",
          black: "#22170c",
          red: "#d96c52",
          green: "#9ba66f",
          yellow: "#d7a34a",
          blue: "#8da1b9",
          magenta: "#c08aa6",
          cyan: "#80aaa0",
          white: "#efd4a3",
          brightBlack: "#7d6749",
          brightRed: "#ef8567",
          brightGreen: "#bdc989",
          brightYellow: "#ffc76b",
          brightBlue: "#a9c0d8",
          brightMagenta: "#dea3c1",
          brightCyan: "#9bcac0",
          brightWhite: "#fff0c9"
        }
      },
      midnight: {
        label: "Midnight",
        colors: {
          background: "#0f1320",
          foreground: "#d7e3ff",
          cursor: "#8cb4ff",
          selectionBackground: "#26304a",
          black: "#0f1320",
          red: "#ff6b6b",
          green: "#7ddc9a",
          yellow: "#ffd166",
          blue: "#78a9ff",
          magenta: "#c792ea",
          cyan: "#65d6e8",
          white: "#d7e3ff",
          brightBlack: "#67728f",
          brightRed: "#ff8080",
          brightGreen: "#95eaaf",
          brightYellow: "#ffe28a",
          brightBlue: "#9bc0ff",
          brightMagenta: "#dcafff",
          brightCyan: "#8fe7f1",
          brightWhite: "#f4f8ff"
        }
      },
      forest: {
        label: "Forest",
        colors: {
          background: "#112117",
          foreground: "#ddebd4",
          cursor: "#92d17d",
          selectionBackground: "#23402a",
          black: "#112117",
          red: "#f08d7e",
          green: "#92d17d",
          yellow: "#e3c15d",
          blue: "#7aa8df",
          magenta: "#b685c9",
          cyan: "#70c5b7",
          white: "#ddebd4",
          brightBlack: "#6e8470",
          brightRed: "#ff9d8f",
          brightGreen: "#ade094",
          brightYellow: "#f0d478",
          brightBlue: "#9ec1eb",
          brightMagenta: "#cfaae0",
          brightCyan: "#92d9ce",
          brightWhite: "#f3f8ee"
        }
      },
      ocean: {
        label: "Ocean",
        colors: {
          background: "#0d1b25",
          foreground: "#d8ebf4",
          cursor: "#6fc2ff",
          selectionBackground: "#19384a",
          black: "#0d1b25",
          red: "#ff7c82",
          green: "#7bd6a3",
          yellow: "#ffd27a",
          blue: "#74b8ff",
          magenta: "#b98cff",
          cyan: "#61d3d9",
          white: "#d8ebf4",
          brightBlack: "#688296",
          brightRed: "#ff9ca0",
          brightGreen: "#9be7bf",
          brightYellow: "#ffe09d",
          brightBlue: "#9bc8ff",
          brightMagenta: "#cfb1ff",
          brightCyan: "#89e9eb",
          brightWhite: "#f5fbff"
        }
      },
      rose: {
        label: "Rose",
        colors: {
          background: "#23161a",
          foreground: "#f3dbe0",
          cursor: "#f29ab2",
          selectionBackground: "#452731",
          black: "#23161a",
          red: "#f18c8c",
          green: "#a4c18a",
          yellow: "#e1bc6f",
          blue: "#8eb4e8",
          magenta: "#d29bd1",
          cyan: "#8dd1cf",
          white: "#f3dbe0",
          brightBlack: "#84696f",
          brightRed: "#ffabab",
          brightGreen: "#bfd8a8",
          brightYellow: "#f0d08b",
          brightBlue: "#b0cdf2",
          brightMagenta: "#e4bee3",
          brightCyan: "#aae4e1",
          brightWhite: "#fff5f7"
        }
      },
      nord: {
        label: "Nord",
        colors: {
          background: "#2e3440",
          foreground: "#eceff4",
          cursor: "#88c0d0",
          selectionBackground: "#4c566a",
          black: "#2e3440",
          red: "#bf616a",
          green: "#a3be8c",
          yellow: "#ebcb8b",
          blue: "#81a1c1",
          magenta: "#b48ead",
          cyan: "#88c0d0",
          white: "#eceff4",
          brightBlack: "#4c566a",
          brightRed: "#d08770",
          brightGreen: "#8fbcbb",
          brightYellow: "#ebcb8b",
          brightBlue: "#5e81ac",
          brightMagenta: "#b48ead",
          brightCyan: "#8fbcbb",
          brightWhite: "#f8fbff"
        }
      }
    };

    const frame = document.getElementById("terminalFrame");
    const copySelectionButton = document.getElementById("copySelection");
    const directLink = document.getElementById("directLink");
    const status = document.getElementById("status");
    const buttons = Array.from(document.querySelectorAll("[data-theme]"));
    const fontSizeSelect = document.getElementById("fontSize");
    const fontFamilySelect = document.getElementById("fontFamily");
    const defaultFontFamily = fontFamilies[0].value;
    let statusResetTimer = null;

    const statusText = () => {
      const fontFamilyLabel = fontFamilies.find((family) => family.value === preferences.fontFamily)?.label || "Custom";
      return `${themes[preferences.theme].label}, ${preferences.fontSize}px, ${fontFamilyLabel}. Сохранено для следующей сессии.`;
    };

    const setStatusText = (message, duration = 0) => {
      status.textContent = message;
      if (statusResetTimer) {
        clearTimeout(statusResetTimer);
        statusResetTimer = null;
      }
      if (duration > 0) {
        statusResetTimer = window.setTimeout(() => {
          status.textContent = statusText();
          statusResetTimer = null;
        }, duration);
      }
    };

    const normalizePreferences = (raw) => {
      const theme = themes[raw.theme] ? raw.theme : "paper";
      const fontSize = fontSizes.includes(Number(raw.fontSize)) ? Number(raw.fontSize) : 12;
      const fontFamily = fontFamilies.some((family) => family.value === raw.fontFamily) ? raw.fontFamily : defaultFontFamily;
      return { theme, fontSize, fontFamily };
    };

    const readPreferences = () => {
      try {
        return normalizePreferences(JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"));
      } catch {
        return { theme: "paper", fontSize: 12, fontFamily: defaultFontFamily };
      }
    };

    const readSessionId = () => {
      const existing = sessionStorage.getItem(SESSION_KEY);
      if (existing) {
        return existing;
      }

      const created = (crypto.randomUUID ? crypto.randomUUID() : `tab-${Date.now()}-${Math.random().toString(16).slice(2)}`).replace(/[^A-Za-z0-9._-]/g, "-");
      sessionStorage.setItem(SESSION_KEY, created);
      return created;
    };

    let preferences = readPreferences();
    const preset = new URLSearchParams(window.location.search).get("preset");
    if (preset && themes[preset]) {
      preferences.theme = preset;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(preferences));
      window.history.replaceState(null, "", window.location.pathname);
    }

    const buildTerminalUrl = () => {
      const theme = themes[preferences.theme] || themes.paper;
      const params = new URLSearchParams();
      params.set("arg", readSessionId());
      params.set("theme", JSON.stringify(theme.colors));
      params.set("fontSize", String(preferences.fontSize));
      params.set("fontFamily", preferences.fontFamily);
      params.set("cursorBlink", "true");
      params.set("disableLeaveAlert", "true");
      return `/terminal/?${params.toString()}`;
    };

    fontSizes.forEach((size) => {
      const option = document.createElement("option");
      option.value = String(size);
      option.textContent = `${size}px`;
      fontSizeSelect.appendChild(option);
    });

    fontFamilies.forEach((family) => {
      const option = document.createElement("option");
      option.value = family.value;
      option.textContent = family.label;
      fontFamilySelect.appendChild(option);
    });

    const render = () => {
      const url = buildTerminalUrl();
      frame.src = url;
      directLink.href = url;
      buttons.forEach((button) => {
        button.classList.toggle("active", button.dataset.theme === preferences.theme);
      });
      fontSizeSelect.value = String(preferences.fontSize);
      fontFamilySelect.value = preferences.fontFamily;
      setStatusText(statusText());
    };

    const saveAndRender = () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(preferences));
      render();
    };

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        preferences.theme = button.dataset.theme;
        saveAndRender();
      });
    });

    fontSizeSelect.addEventListener("change", () => {
      const nextSize = Number(fontSizeSelect.value);
      if (!Number.isNaN(nextSize)) {
        preferences.fontSize = nextSize;
        saveAndRender();
      }
    });

    fontFamilySelect.addEventListener("change", () => {
      preferences.fontFamily = fontFamilySelect.value;
      saveAndRender();
    });

    const getFrameSelection = () => {
      try {
        return frame.contentWindow?.getSelection?.()?.toString() || "";
      } catch {
        return "";
      }
    };

    const copySelection = async () => {
      const selection = getFrameSelection().trim();
      if (!selection) {
        setStatusText("Сначала выдели текст в терминале.", 2200);
        return;
      }

      try {
        await navigator.clipboard.writeText(selection);
        setStatusText("Выделение скопировано.", 2200);
      } catch {
        try {
          frame.contentWindow?.document?.execCommand?.("copy");
          setStatusText("Выделение скопировано.", 2200);
        } catch {
          setStatusText("Браузер не дал доступ к буферу обмена.", 2600);
        }
      }
    };

    copySelectionButton.addEventListener("click", () => {
      copySelection();
    });

    window.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.shiftKey && event.key.toLowerCase() === "c") {
        event.preventDefault();
        copySelection();
      }
    });

    render();
  </script>
</body>
</html>
