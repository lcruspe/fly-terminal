<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal</title>
  <style>
    :root {
      --bg-start: #f8f0dd;
      --bg-end: #e3d4b9;
      --glow-a: rgba(198, 95, 47, 0.18);
      --glow-b: rgba(63, 111, 159, 0.14);
      --panel: rgba(255, 250, 239, 0.86);
      --panel-solid: rgba(255, 250, 239, 0.98);
      --control: rgba(255, 255, 255, 0.5);
      --control-strong: rgba(255, 255, 255, 0.78);
      --button-bg: rgba(255, 255, 255, 0.5);
      --button-bg-strong: rgba(255, 255, 255, 0.78);
      --button-ink: #27221d;
      --ink: #27221d;
      --muted: #766c60;
      --accent: #c65f2f;
      --border: rgba(67, 54, 41, 0.16);
      --focus: rgba(198, 95, 47, 0.45);
      --ok: #2f7a52;
      --warn: #a66d27;
      --danger: #9f4d46;
      --terminal-shell: #181511;
      --terminal-edge: rgba(39, 34, 29, 0.28);
      --terminal-topbar-bg: rgba(0, 0, 0, 0.18);
      --terminal-topbar-ink: #27221d;
      --select-bg: rgba(255, 255, 255, 0.6);
      --badge-bg: rgba(255, 255, 255, 0.44);
      --active-btn-ink: #fff8eb;
      --shadow: 0 24px 80px rgba(63, 45, 25, 0.18);
      --panel-radius: 12px;
      --control-radius: 10px;
      --terminal-radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background:
        radial-gradient(circle at 12% 12%, var(--glow-a), transparent 34%),
        radial-gradient(circle at 86% 8%, var(--glow-b), transparent 28%),
        linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .shell {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100vh;
      padding: 14px;
      position: relative;
      box-sizing: border-box;
    overflow: hidden; }

    
    .bottom-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 100;
      width: 100%;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
      flex-shrink: 0;
    }

    

    .bottom-panel.collapsed {
      position: fixed;
      bottom: 14px;
      right: 14px;
      width: auto;
      z-index: 1000;
      gap: 0;
    }

    .bottom-panel.collapsed .tab-bar,
    .bottom-panel.collapsed .toolbar-primary,
    .bottom-panel.collapsed .control-group:not(.panel-toggle-group),
    .bottom-panel.collapsed .settings {
      display: none;
    }

    .bottom-panel.collapsed .toolbar {
      background: transparent;
      border: 0;
      box-shadow: none;
      padding: 0;
    }

    .bottom-panel.collapsed .controls {
      gap: 0;
    }

    .bottom-panel.collapsed #togglePanel {
      border-radius: 999px;
      box-shadow: var(--shadow);
      padding: 10px 12px;
    }

    .toolbar {
      align-items: center;
      backdrop-filter: blur(20px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--panel-radius);
      box-shadow: var(--shadow);
      display: flex;
      gap: 10px;
      justify-content: space-between;
      overflow: visible;
      padding: 8px 10px 8px 14px;
      position: relative;
      z-index: 30;
    }

    .toolbar-primary {
      align-items: center;
      display: flex;
      gap: 10px;
      min-width: 240px;
    }

    .brand {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .brand strong {
      font-size: 15px;
      letter-spacing: 0.02em;
    }

    .brand span {
      color: var(--muted);
      font-size: 12px;
    }

    .session-meta {
      display: flex;
      flex-shrink: 0;
    }

    .badge {
      background: var(--badge-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font: 700 11px/1 "Avenir Next", "Segoe UI", sans-serif;
      padding: 7px 9px;
      white-space: nowrap;
    }

    .badge-ok {
      color: var(--ok);
    }

    .badge-warn {
      color: var(--warn);
    }

    .controls {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }

    .control-group {
      align-items: center;
      display: inline-flex;
      gap: 6px;
    }

    .layout-controls {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid var(--border);
      border-radius: var(--control-radius);
      padding: 3px;
    }

    .control-label {
      color: var(--muted);
      font: 700 10px/1 "Avenir Next", "Segoe UI", sans-serif;
      letter-spacing: 0.06em;
      padding: 0 4px 0 2px;
      text-transform: uppercase;
    }

    .view-switch {
      background: var(--control);
      border: 1px solid var(--border);
      border-radius: var(--control-radius);
      display: inline-flex;
      padding: 3px;
    }

    .view-switch button {
      border-color: transparent;
      box-shadow: none;
      padding: 6px 8px;
    }

    /* Tabs Bar */
    .tab-bar {      display: flex;      gap: 6px;      align-items: center;      overflow-x: auto;      padding: 8px 12px;      scrollbar-width: none;      z-index: 20;      backdrop-filter: blur(20px);      background: var(--panel);      border: 1px solid var(--border);      border-radius: var(--panel-radius);      box-shadow: var(--shadow);    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .mode-split #tabBar { display: none; }

    .tab {
      background: var(--button-bg);
      border: 1px solid var(--border);
      border-radius: var(--control-radius);
      color: var(--button-ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      font: 600 12px/1 "Avenir Next", "Segoe UI", sans-serif;
      padding: 8px 12px;
      white-space: nowrap;
      transition: all 140ms ease;
      position: relative;
      gap: 8px;
    }
    .tab:hover { background: var(--button-bg-strong); transform: translateY(-1px); }
    .tab.active {
      background: var(--accent);
      border-color: transparent;
      color: var(--active-btn-ink);
    }
    .tab-close {
      opacity: 0.5;
      border-radius: 4px;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }
    .tab-close:hover {
      background: rgba(0,0,0,0.1);
      opacity: 1;
    }

    /* New Tab Button in Tab Bar */
    .new-tab-btn {
      font-size: 18px;
      font-weight: 600;
      padding: 4px 10px;
      min-width: auto;
      background: transparent;
      border: 1px dashed var(--border);
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 140ms ease, background 140ms ease;
    }
    .new-tab-btn:hover {
      background: var(--button-bg);
      opacity: 1;
    }

    .terminal-container {
      display: grid;
      height: 100%;
      min-height: 0;
      gap: 12px;
      flex: 1;
    }

    /* Modes */
    .mode-tabs .terminal-frame-wrapper:not(.active) {
      display: none;
    }
    .mode-split {
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      grid-template-rows: repeat(auto-fit, minmax(300px, 1fr));
    }
    .mode-split .terminal-frame-wrapper.active {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      box-shadow: 0 0 0 4px var(--focus);
    }

    @media (max-width: 700px) {
      .mode-split {
        grid-template-columns: 1fr;
      }
    }

    .terminal-frame-wrapper {
      background: var(--terminal-shell);
      border: 1px solid var(--terminal-edge);
      border-radius: var(--terminal-radius);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
      overflow: hidden;
      position: relative;
      transition: outline 140ms ease, box-shadow 140ms ease;
    }

    body.frame-fullscreen-active {
      overflow: hidden;
    }

    .terminal-frame-wrapper.fullscreen {
      border: 0;
      border-radius: 0;
      box-shadow: none;
      inset: 0;
      outline: 0;
      position: fixed;
      z-index: 2000;
    }

    .terminal-frame-wrapper.fullscreen .terminal-topbar {
      min-height: 42px;
    }

    /* Restore Original Button styles */
    button,
    a.button,
    summary.button {
      appearance: none;
      background: var(--button-bg);
      border: 1px solid var(--border);
      border-radius: var(--control-radius);
      color: var(--button-ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font: 700 12px/1 "Avenir Next", "Segoe UI", sans-serif;
      padding: 7px 9px;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    button:hover,
    a.button:hover,
    summary.button:hover {
      background: var(--button-bg-strong);
      transform: translateY(-1px);
    }

    button.active {
      background: var(--accent);
      border-color: transparent;
      color: var(--active-btn-ink);
    }
    
    .dropdown-menu button,
    .dropdown-menu a.button {
      background: transparent;
      border: none;
      border-radius: 6px;
      color: var(--ink);
      padding: 10px 12px;
      transform: none;
      width: 100%;
    }
    .dropdown-menu button:hover,
    .dropdown-menu a.button:hover {
      background: var(--control);
      transform: none;
    }

    .settings summary {
      list-style: none;
    }
    .settings summary::-webkit-details-marker { display: none; }
    .settings summary::after { content: "▾"; margin-left: 8px; font-size: 11px; }
    .settings[open] summary::after { content: "▴"; }

    .settings {
      position: relative;
    }

    .settings-panel {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--panel-radius);
      box-shadow: 0 18px 44px rgba(63, 45, 25, 0.2);
      display: grid;
      gap: 14px;
      margin-top: 10px;
      padding: 14px;
      position: absolute;
      right: 0;
      bottom: calc(100% + 2px);
      width: min(420px, calc(100vw - 28px));
      z-index: 40;
    }

    button svg,
    a.button svg {
      flex: 0 0 auto;
    }

    .settings-group {
      display: grid;
      gap: 8px;
    }

    .settings-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .theme-grid {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .theme-grid button {
      align-items: flex-start;
      flex-direction: column;
      gap: 3px;
      justify-content: center;
      min-height: 52px;
      padding: 9px 11px;
      width: 100%;
    }

    .theme-name {
      font-size: 13px;
      font-weight: 700;
    }

    .theme-mode {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .settings-row {
      align-items: center;
      display: grid;
      gap: 10px;
      grid-template-columns: 96px minmax(0, 1fr);
    }

    .settings-row label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    select {
      appearance: none;
      background:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%),
        var(--select-bg);
      background-position:
        calc(100% - 16px) calc(50% + 1px),
        calc(100% - 10px) calc(50% + 1px),
        center;
      background-repeat: no-repeat;
      background-size: 6px 6px, 6px 6px, 100% 100%;
      border: 1px solid var(--border);
      border-radius: var(--control-radius);
      color: var(--ink);
      font: 600 13px/1.2 "Avenir Next", "Segoe UI", sans-serif;
      padding: 10px 36px 10px 12px;
      width: 100%;
    }

    select:focus,
    button:focus-visible,
    a.button:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .terminal-topbar {
      align-items: center;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent),
        var(--terminal-topbar-bg);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      gap: 12px;
      justify-content: space-between;
      padding: 8px 12px;
    }

    .terminal-heading {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .terminal-heading strong {
      color: var(--terminal-topbar-ink);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .terminal-heading span {
      color: var(--terminal-topbar-ink);
      font-size: 11px;
      opacity: 0.8;
    }

    .terminal-actions {
      align-items: center;
      display: inline-flex;
      flex: 0 0 auto;
      gap: 6px;
    }

    .frame-control {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.14);
      color: var(--terminal-topbar-ink);
      height: 28px;
      justify-content: center;
      padding: 0;
      width: 28px;
    }

    .frame-control:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .terminal-tools {
      color: var(--terminal-topbar-ink);
      font-size: 11px;
      text-align: right;
      opacity: 0.8;
    }

    .terminal-stage {
      min-height: 0;
      position: relative;
    }

    .terminal-overlay {
      align-content: end;
      background:
        linear-gradient(180deg, rgba(17, 18, 22, 0.2), rgba(17, 18, 22, 0.72)),
        linear-gradient(135deg, rgba(255, 255, 255, 0.04), transparent 58%);
      color: #f7f1e8;
      display: grid;
      gap: 6px;
      inset: 0;
      opacity: 0;
      padding: 18px;
      pointer-events: none;
      position: absolute;
      transition: opacity 180ms ease;
      z-index: 3;
    }

    .terminal-overlay.visible {
      opacity: 1;
    }

    .terminal-overlay strong {
      font-size: 15px;
      letter-spacing: 0.01em;
    }

    .terminal-overlay span {
      color: rgba(247, 241, 232, 0.76);
      font-size: 12px;
      line-height: 1.45;
      max-width: 38rem;
    }

    iframe {
      background: var(--terminal-shell);
      border: 0;
      height: 100%;
      width: 100%;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
    }

    /* Dropdown menus */
    .dropdown {
      position: relative;
    }

    .dropdown summary {
      list-style: none;
      cursor: pointer;
    }

    .dropdown summary::-webkit-details-marker {
      display: none;
    }

    .dropdown summary::after {
      content: "";
      display: inline-block;
      width: 0;
      height: 0;
      margin-left: 8px;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid var(--muted);
      transition: transform 140ms ease;
    }

    .dropdown[open] summary::after {
      transform: rotate(180deg);
    }

    .dropdown-menu {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--control-radius);
      box-shadow: 0 12px 32px rgba(63, 45, 25, 0.16);
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 6px;
      min-width: 190px;
      padding: 4px;
      position: absolute;
      right: 0;
      top: calc(100% + 2px);
      z-index: 40;
    }

    .dropdown-menu button,
    .dropdown-menu a.button {
      background: transparent;
      border: none;
      border-radius: 6px;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      font: 600 13px/1 "Avenir Next", "Segoe UI", sans-serif;
      gap: 8px;
      justify-content: flex-start;
      padding: 10px 12px;
      text-align: left;
      text-decoration: none;
      transition: background 100ms ease;
      white-space: nowrap;
      width: 100%;
    }

    .dropdown-menu button:hover,
    .dropdown-menu a.button:hover {
      background: var(--control);
      transform: none;
    }

    .dropdown-menu button:active,
    .dropdown-menu a.button:active {
      background: var(--control-strong);
    }

    .dropdown-menu .divider {
      border-top: 1px solid var(--border);
      margin: 2px 8px;
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
      }

      .shell {
        min-height: 100%;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
        border-radius: var(--panel-radius);
      }

      .toolbar-primary,
      .controls {
        width: 100%;
      }

      .toolbar-primary {
        justify-content: space-between;
      }

      .controls {
        justify-content: flex-start;
      }

      .terminal {
        min-height: 70vh;
      }
    }

    /* Layout presets for Split Mode */
    .layout-presets-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    #splitLayoutPresets {
      display: inline-flex;
      gap: 4px;
    }

    .layout-preset-btn {
      background: var(--button-bg);
      border: 1px solid var(--border);
      border-radius: var(--control-radius);
      padding: 5px 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    .layout-preset-btn:hover {
      background: var(--button-bg-strong);
      transform: translateY(-1px);
    }

    .layout-preset-btn.active {
      background: var(--accent);
      border-color: transparent;
    }

    .mini-preview {
      width: 20px;
      height: 14px;
      display: grid;
      gap: 1px;
      background: transparent;
    }

    .mini-preview-cell {
      background: var(--ink);
      opacity: 0.35;
      border-radius: 1px;
      transition: background 140ms ease, opacity 140ms ease;
    }

    .layout-preset-btn:hover .mini-preview-cell {
      opacity: 0.6;
    }

    .layout-preset-btn.active .mini-preview-cell {
      background: var(--active-btn-ink);
      opacity: 0.8;
    }

    .layout-preset-btn.active .mini-preview-cell:first-child {
      opacity: 1;
    }
  </style>
</head>
<body>

  <main class="shell">
    <section class="terminal-container mode-tabs" id="terminalContainer"></section>

    <div class="bottom-panel" id="bottomPanel">
      <nav class="tab-bar" id="tabBar"></nav>
      <section class="toolbar" aria-label="Terminal settings">
        <div class="toolbar-primary">
          <div class="brand">
            <strong>Fly Terminal</strong>
            <span id="status">Browser-first терминал без локального SSH-клиента</span>
          </div>
          <div class="session-meta" aria-label="Terminal session details">
            <span class="badge badge-neutral" id="sessionState">Подключение</span>
          </div>
        </div>
        <div class="controls">
          <div class="control-group panel-toggle-group">
            <button type="button" id="togglePanel" title="Свернуть панель">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l4 4 4-4"/><path d="M4 4h8"/></svg>
              <span class="button-label">Свернуть</span>
            </button>
          </div>

          <div class="control-group layout-controls" aria-label="Режим и компоновка">
            <span class="control-label">Вид</span>
            <div class="view-switch" aria-label="Режим отображения">
              <button type="button" id="viewTabs" class="active" title="Вкладки">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="12" height="8" rx="1"/><path d="M2 7h12"/></svg>
                Вкладки
              </button>
              <button type="button" id="viewSplit" title="Сплит">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M8 2v12M2 8h12"/></svg>
                Сплит
              </button>
            </div>
            <div id="splitLayoutContainer" class="layout-presets-wrapper" style="display: none;">
              <div id="splitLayoutPresets"></div>
            </div>
          </div>

          <div class="control-group session-controls">
            <button type="button" id="addBrowser" hidden>
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2a9 9 0 0 1 0 12M8 2a9 9 0 0 0 0 12"/></svg>
              Browser
            </button>
            <a class="button" id="directLink" href="/terminal/" target="_blank" rel="noreferrer">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l8-8M9 2h5v5M6 4H3a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-3"/></svg>
              Новое окно
            </a>
            <button type="button" id="reloadSession" title="Переподключить активную вкладку">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8a6 6 0 0 1 11.5-2.5M14 8a6 6 0 0 1-11.5 2.5"/><path d="M13.5 2v3.5H10M2.5 14v-3.5H6"/></svg>
              Переподключить

    // State

    let activeTabId = null;

    function createId() { return Math.random().toString(36).substr(2, 9); }
    function createSessionId() { return (crypto.randomUUID ? crypto.randomUUID() : `tab-${Date.now()}-${Math.random().toString(16).slice(2)}`).replace(/[^A-Za-z0-9._-]/g, "-"); }

    function resetStoredSessions() {
      try {
        sessionStorage.removeItem(SESSIONS_STORE_KEY);
      } catch (e) {}
    }

    function recoverTerminalUi(reason = "recovery") {
      if (bootRecoveryAttempted) return;
      bootRecoveryAttempted = true;
      resetStoredSessions();
      tabs.forEach(tab => tab.wrapper?.remove());
      tabs = [];
      activeTabId = null;
      addTab(null, "Terminal");
      setViewMode("tabs");
      setSessionState("badge-warn", "Вкладки сброшены");
      setStatusText(`Восстановлено после ошибки: ${reason}`, 3200);
    }

    window.addEventListener("error", (event) => {
      const message = String(event.message || "");
      const recoverable =
        message.includes("Cannot read properties") ||
        message.includes("undefined") ||
        message.includes("null") ||
        message.includes("tabs") ||
        message.includes("sessionStorage");
      if (recoverable) {
        event.preventDefault();
        recoverTerminalUi("поврежденное состояние");
      }
    });

    window.addEventListener("unhandledrejection", (event) => {
      const reason = String(event.reason?.message || event.reason || "");
      if (reason.includes("Cannot read properties") || reason.includes("undefined") || reason.includes("null")) {
        event.preventDefault();
        recoverTerminalUi("ошибка загрузки");
      }
    });

    function readPreferences() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        const validLayouts = ["grid", "columns", "rows", "master-left", "master-top"];
        return {
          theme: themes[raw.theme] ? raw.theme : "paper",
          fontSize: fontSizes.includes(Number(raw.fontSize)) ? Number(raw.fontSize) : 12,
          fontFamily: fontFamilies.some(f => f.value === raw.fontFamily) ? raw.fontFamily : fontFamilies[0].value,
          splitLayout: validLayouts.includes(raw.splitLayout) ? raw.splitLayout : "grid",
          panelCollapsed: !!raw.panelCollapsed
        };
      } catch {
        return { theme: "paper", fontSize: 12, fontFamily: fontFamilies[0].value, splitLayout: "grid", panelCollapsed: false };
      }
    }

    function savePreferences() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(preferences));
      applyAllThemes();
    }

    function setStatusText(message, duration = 0) {
      status.textContent = message;
      if (statusResetTimer) clearTimeout(statusResetTimer);
      if (duration > 0) {
        statusResetTimer = setTimeout(() => {
          const theme = themes[preferences.theme];
          status.textContent = `${theme.label}, ${preferences.fontSize}px. ${tabs.length} сессий.`;
        }, duration);
      }
    }

    function getLayoutStyles(layout, N) {
      const container = { gridTemplateColumns: '1fr', gridTemplateRows: '1fr' };
      const items = Array.from({ length: N }, () => ({ gridRow: 'auto', gridColumn: 'auto' }));
      
      if (N <= 1) {
        return { container, items };
      }
      
      if (layout === 'grid') {
        const cols = Math.ceil(Math.sqrt(N));
        const rows = Math.ceil(N / cols);
        container.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        container.gridTemplateRows = `repeat(${rows}, 1fr)`;
      } else if (layout === 'columns') {
        container.gridTemplateColumns = `repeat(${N}, 1fr)`;
        container.gridTemplateRows = '1fr';
      } else if (layout === 'rows') {
        container.gridTemplateColumns = '1fr';
        container.gridTemplateRows = `repeat(${N}, 1fr)`;
      } else if (layout === 'master-left') {
        container.gridTemplateColumns = '2fr 1fr';
        container.gridTemplateRows = `repeat(${N - 1}, 1fr)`;
        items[0].gridRow = `1 / span ${N - 1}`;
        items[0].gridColumn = '1';
        for (let i = 1; i < N; i++) {
          items[i].gridColumn = '2';
          items[i].gridRow = 'auto';
        }
      } else if (layout === 'master-top') {
        container.gridTemplateColumns = `repeat(${N - 1}, 1fr)`;
        container.gridTemplateRows = '2fr 1fr';
        items[0].gridColumn = `1 / span ${N - 1}`;
        items[0].gridRow = '1';
        for (let i = 1; i < N; i++) {
          items[i].gridRow = '2';
          items[i].gridColumn = 'auto';
        }
      }
      
      return { container, items };
    }

    function createMiniPreviewHtml(layout, N) {
      const styles = getLayoutStyles(layout, N);
      let cellsHtml = '';
      for (let i = 0; i < N; i++) {
        const itemStyle = styles.items[i];
        const styleAttr = `grid-row: ${itemStyle.gridRow}; grid-column: ${itemStyle.gridColumn};`;
        cellsHtml += `<div class="mini-preview-cell" style="${styleAttr}"></div>`;
      }
      const containerStyle = `grid-template-columns: ${styles.container.gridTemplateColumns}; grid-template-rows: ${styles.container.gridTemplateRows};`;
      return `
        <div class="mini-preview" style="${containerStyle}">
          ${cellsHtml}
        </div>
      `;
    }

    function renderSplitLayoutPresets() {
      const N = tabs.length;
      if (N <= 1) {
        splitLayoutContainer.style.display = 'none';
        return;
      }
      
      if (viewMode === 'split') {
        splitLayoutContainer.style.display = 'inline-flex';
      } else {
        splitLayoutContainer.style.display = 'none';
      }
      
      const presets = [
        { id: 'grid', title: 'Сетка' },
        { id: 'columns', title: 'Колонки' },
        { id: 'rows', title: 'Строки' },
        { id: 'master-left', title: 'Главный слева' },
        { id: 'master-top', title: 'Главный сверху' }
      ];
      
      splitLayoutPresets.innerHTML = '';
      
      presets.forEach(preset => {
        const activeLayout = preferences.splitLayout || 'grid';
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `layout-preset-btn ${preset.id === activeLayout ? 'active' : ''}`;
        button.title = preset.title;
        button.innerHTML = createMiniPreviewHtml(preset.id, N);
        button.onclick = () => {
          preferences.splitLayout = preset.id;
          savePreferences();
          renderSplitLayoutPresets();
          applySplitLayout();
        };
        splitLayoutPresets.appendChild(button);
      });
    }

    function applySplitLayout() {
      if (fullscreenTabId) {
        terminalContainer.style.display = '';
        terminalContainer.style.gridTemplateColumns = '';
        terminalContainer.style.gridTemplateRows = '';
        tabs.forEach(tab => {
          tab.wrapper.style.gridRow = '';
          tab.wrapper.style.gridColumn = '';
        });
        return;
      }

      if (viewMode !== 'split') {
        terminalContainer.style.display = '';
        terminalContainer.style.gridTemplateColumns = '';
        terminalContainer.style.gridTemplateRows = '';
        tabs.forEach(tab => {
          tab.wrapper.style.gridRow = '';
          tab.wrapper.style.gridColumn = '';
        });
        return;
      }
      
      const N = tabs.length;
      const layout = preferences.splitLayout || 'grid';
      
      const styles = getLayoutStyles(layout, N);
      
      terminalContainer.style.display = 'grid';
      terminalContainer.style.gridTemplateColumns = styles.container.gridTemplateColumns;
      terminalContainer.style.gridTemplateRows = styles.container.gridTemplateRows;
      
      tabs.forEach((tab, index) => {
        const itemStyle = styles.items[index];
        if (itemStyle) {
          tab.wrapper.style.gridRow = itemStyle.gridRow;
          tab.wrapper.style.gridColumn = itemStyle.gridColumn;
        } else {
          tab.wrapper.style.gridRow = '';
          tab.wrapper.style.gridColumn = '';
        }
      });
    }

    function buildTerminalUrl(sessionId) {
      const theme = themes[preferences.theme];
      const params = new URLSearchParams();
      params.set("arg", sessionId);
      params.set("theme", JSON.stringify(theme.colors));
      params.set("fontSize", String(preferences.fontSize));
      params.set("fontFamily", preferences.fontFamily);
      params.set("cursorBlink", "true");
      params.set("disableLeaveAlert", "true");
      return `/terminal/?${params.toString()}`;
    }

    function buildBrowserUrl() {
      return browserConfig.url || "about:blank";
    }

    function fullscreenIcon(expanded = false) {
      return expanded
        ? '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v4H2"/><path d="M10 2v4h4"/><path d="M6 14v-4H2"/><path d="M10 14v-4h4"/></svg>'
        : '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2H2v4"/><path d="M10 2h4v4"/><path d="M6 14H2v-4"/><path d="M10 14h4v-4"/></svg>';
    }

    function updateFullscreenButtons() {
      tabs.forEach(tab => {
        const isFullscreen = fullscreenTabId === tab.id;
        const button = tab.wrapper.querySelector(".frame-fullscreen-btn");
        if (!button) return;
        button.classList.toggle("active", isFullscreen);
        button.title = isFullscreen ? "Свернуть" : "На весь экран";
        button.setAttribute("aria-label", button.title);
        button.setAttribute("aria-pressed", String(isFullscreen));
        button.innerHTML = fullscreenIcon(isFullscreen);
      });
    }

    function setFrameFullscreen(id, enabled) {
      const tab = tabs.find(t => t.id === id);
      if (!tab && enabled) return;

      fullscreenTabId = enabled ? id : null;
      document.body.classList.toggle("frame-fullscreen-active", Boolean(fullscreenTabId));

      tabs.forEach(t => {
        t.wrapper.classList.toggle("fullscreen", fullscreenTabId === t.id);
      });

      updateFullscreenButtons();
      applySplitLayout();

      if (fullscreenTabId) {
        switchTab(fullscreenTabId);
        setStatusText("Развернуто на весь экран", 1600);
      } else {
        setStatusText("Обычный режим", 1200);
      }

      const activeTab = tabs.find(t => t.id === activeTabId);
      const iframe = activeTab?.wrapper.querySelector("iframe");
      setTimeout(() => {
        try {
          iframe?.contentWindow?.focus();
        } catch (e) {}
      }, 80);
    }

    function toggleFrameFullscreen(id, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      setFrameFullscreen(id, fullscreenTabId !== id);
    }

    function refreshDirectLink() {
      directLink.href = buildTerminalUrl(createSessionId());
    }

    function applyShellTheme() {
      const theme = themes[preferences.theme];
      const root = document.documentElement.style;
      root.setProperty("--bg-start", theme.shell.bgStart);
      root.setProperty("--bg-end", theme.shell.bgEnd);
      root.setProperty("--glow-a", theme.shell.glowA);
      root.setProperty("--glow-b", theme.shell.glowB);
      root.setProperty("--panel", theme.shell.panel);
      root.setProperty("--panel-solid", theme.shell.panelSolid);
      root.setProperty("--control", theme.shell.control);
      root.setProperty("--control-strong", theme.shell.controlStrong);
      root.setProperty("--button-bg", theme.shell.buttonBg || theme.shell.control);
      root.setProperty("--button-bg-strong", theme.shell.buttonBgStrong || theme.shell.controlStrong);
      root.setProperty("--button-ink", theme.shell.buttonInk || theme.shell.ink);
      root.setProperty("--ink", theme.shell.ink);
      root.setProperty("--muted", theme.shell.muted);
      root.setProperty("--accent", theme.shell.accent);
      root.setProperty("--border", theme.shell.border);
      root.setProperty("--focus", theme.shell.focus);
      root.setProperty("--terminal-shell", theme.shell.terminalShell);
      root.setProperty("--terminal-edge", theme.shell.terminalEdge);
      root.setProperty("--terminal-topbar-bg", theme.shell.terminalTopbarBg || "rgba(0, 0, 0, 0.18)");
      root.setProperty("--terminal-topbar-ink", theme.shell.terminalTopbarInk || theme.shell.ink);
      root.setProperty("--select-bg", theme.mode === "light" ? "rgba(255, 255, 255, 0.6)" : "rgba(255, 255, 255, 0.15)");
      root.setProperty("--badge-bg", theme.mode === "light" ? "rgba(255, 255, 255, 0.44)" : "rgba(255, 255, 255, 0.15)");
      root.setProperty("--active-btn-ink", theme.shell.activeButtonInk || "#fff8eb");
      root.setProperty("--shadow", theme.shell.shadow);
      root.setProperty("--ok", theme.mode === "light" ? "#2f7a52" : "#7fc598");
      root.setProperty("--warn", theme.mode === "light" ? "#a66d27" : "#e7c384");
      root.setProperty("--danger", theme.mode === "light" ? "#9f4d46" : "#ef8d8d");
      
      themeButtons.forEach(btn => btn.classList.toggle("active", btn.dataset.theme === preferences.theme));
    }

    function syncIframe(iframe, type = "terminal") {
      if (type !== "terminal") return;
      try {
        const doc = iframe.contentDocument;
        const theme = themes[preferences.theme];
        if (!doc) return;
        let style = doc.getElementById(FRAME_STYLE_ID);
        if (!style) {
          style = doc.createElement("style");
          style.id = FRAME_STYLE_ID;
          doc.head.appendChild(style);
        }
        style.textContent = `
          html, body { background: ${theme.colors.background} !important; overflow: hidden !important; }
          #terminal-container, .terminal, .xterm, .xterm-screen, .xterm-viewport { background: ${theme.colors.background} !important; }
          #terminal-container { padding: 0 !important; height: 100% !important; width: 100% !important; max-width: none !important; }
          .xterm-viewport { scrollbar-width: thin; scrollbar-color: ${theme.colors.brightBlack} ${theme.colors.background}; }
        `;
      } catch (e) {}
    }

    function applyAllThemes() {
      applyShellTheme();
      tabs.forEach(tab => {
        const iframe = tab.wrapper.querySelector("iframe");
        if (iframe) syncIframe(iframe, tab.type);
      });
    }

    async function loadBrowserConfig() {
      try {
        const response = await fetch("/api/browser/config", { cache: "no-store" });
        const config = await response.json();
        browserConfig = {
          enabled: Boolean(config.enabled && config.url),
          url: typeof config.url === "string" ? config.url : ""
        };
      } catch (e) {
        browserConfig = { enabled: false, url: "" };
      }

      addBrowserBtn.hidden = !browserConfig.enabled;
    }

    function addTab(sessionId = null, label = "Terminal") {
      const id = createId();
      // Ensure we don't accidentally reuse a session ID if it's already open
      let sId = sessionId;
      if (!sId || tabs.some(t => t.sessionId === sId)) {
        sId = createSessionId();
      }
      
      const wrapper = document.createElement("div");
      wrapper.className = "terminal-frame-wrapper";
      wrapper.id = `wrapper-${id}`;
      wrapper.innerHTML = `
        <div class="terminal-topbar">
          <div class="terminal-heading">
            <strong class="tab-label-text">${label}</strong>
            <span class="tab-subtext">${sId.slice(0, 8)}...</span>
          </div>
          <div class="terminal-actions">
            <button type="button" class="frame-control frame-fullscreen-btn" title="На весь экран" aria-label="На весь экран" aria-pressed="false">
              ${fullscreenIcon(false)}
            </button>
          </div>
        </div>
        <div class="terminal-stage">
          <iframe src="${buildTerminalUrl(sId)}" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
        </div>
      `;
      
      const tab = { id, type: "terminal", sessionId: sId, label, customLabel: null, wrapper };
      tabs.push(tab);
      terminalContainer.appendChild(wrapper);
      
      // Handle activation on click for Split Mode
      wrapper.addEventListener('mousedown', () => switchTab(id));
      wrapper.querySelector(".frame-fullscreen-btn").onclick = (event) => toggleFrameFullscreen(id, event);

      const iframe = wrapper.querySelector("iframe");
      iframe.addEventListener("load", () => {
        syncIframe(iframe, tab.type);
        setSessionState("badge-ok", "Готово");
      });

      renderTabs();
      switchTab(id);
      renderSplitLayoutPresets();
      applySplitLayout();
      saveSessions();
      return tab;
    }

    function addBrowserTab(label = "Browser", customLabel = null) {
      const id = createId();
      const wrapper = document.createElement("div");
      wrapper.className = "terminal-frame-wrapper";
      wrapper.id = `wrapper-${id}`;
      wrapper.innerHTML = `
        <div class="terminal-topbar">
          <div class="terminal-heading">
            <strong class="tab-label-text">${customLabel || label}</strong>
            <span class="tab-subtext">remote chromium</span>
          </div>
          <div class="terminal-actions">
            <button type="button" class="frame-control frame-fullscreen-btn" title="На весь экран" aria-label="На весь экран" aria-pressed="false">
              ${fullscreenIcon(false)}
            </button>
          </div>
        </div>
        <div class="terminal-stage">
          <iframe src="${buildBrowserUrl()}" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
        </div>
      `;

      const tab = { id, type: "browser", sessionId: null, label, customLabel, wrapper };
      tabs.push(tab);
      terminalContainer.appendChild(wrapper);

      wrapper.addEventListener('mousedown', () => switchTab(id));
      wrapper.querySelector(".frame-fullscreen-btn").onclick = (event) => toggleFrameFullscreen(id, event);

      wrapper.querySelector("iframe").addEventListener("load", () => {
        setSessionState("badge-ok", "Browser готов");
        // Inject error suppressor into KasmVNC iframe to swallow the
        // "Cannot read properties of undefined (reading 'lastActiveAt')" crash
        // that KasmVNC throws when session state is transiently null on first load.
        try {
          const win = wrapper.querySelector("iframe").contentWindow;
          if (!win) return;
          // Patch onerror so the KasmVNC error modal is never shown
          const origOnError = win.onerror;
          win.onerror = function(msg, src, line, col, err) {
            const s = String(msg || "");
            if (s.includes("lastActiveAt") || s.includes("Cannot read properties of undefined")) {
              // Silently swallow — KasmVNC recovers on its own after init
              return true;
            }
            return origOnError ? origOnError.apply(this, arguments) : false;
          };
          // Also hide any already-rendered KasmVNC error dialog
          const doc = win.document;
          const hideKasmError = () => {
            doc.querySelectorAll(
              ".kasm-error, .error-dialog, [class*=\"ErrorDialog\"], [class*=\"error-dialog\"]"
            ).forEach(el => { el.style.display = "none"; });
          };
          hideKasmError();
          // Observe DOM mutations so the dialog is hidden as soon as it appears
          const obs = new win.MutationObserver(hideKasmError);
          obs.observe(doc.body || doc.documentElement, { childList: true, subtree: true });
          // Stop watching after 15 s — by then KasmVNC init is done
          setTimeout(() => obs.disconnect(), 15000);
        } catch (_) {}
      });

      renderTabs();
      switchTab(id);
      renderSplitLayoutPresets();
      applySplitLayout();
      saveSessions();
      return tab;
    }

    function switchTab(id) {
      if (!id) return;
      activeTabId = id;
      tabs.forEach(t => {
        const isActive = (t.id === id);
        t.active = isActive;
        t.wrapper.classList.toggle("active", isActive);
      });
      renderTabs();
      
      const activeTab = tabs.find(t => t.id === id);
      if (activeTab) {
        const iframe = activeTab.wrapper.querySelector("iframe");
        try {
          iframe?.contentWindow?.focus();
          if (activeTab.type === "terminal") {
            const textarea = iframe?.contentDocument?.querySelector(".xterm-helper-textarea");
            textarea?.focus({ preventScroll: true });
          }
        } catch(e) {}
      }
    }

    async function closeTab(id, event) {
      if (event) event.stopPropagation();
      const index = tabs.findIndex(t => t.id === id);
      if (index === -1) return;
      
      const tab = tabs[index];
      if (fullscreenTabId === id) {
        setFrameFullscreen(id, false);
      }

      if (tab.type === "terminal" && tab.sessionId) {
        fetch("/api/session/terminate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId: tab.sessionId })
        }).catch(() => {});
      }

      tab.wrapper.remove();
      tabs.splice(index, 1);
      
      if (tabs.length === 0) {
        addTab();
      } else if (activeTabId === id) {
        switchTab(tabs[Math.max(0, index - 1)].id);
      } else {
        renderTabs();
      }
      renderSplitLayoutPresets();
      applySplitLayout();
      saveSessions();
    }

    function renameTab(id) {
      const tab = tabs.find(t => t.id === id);
      if (!tab) return;
      const newName = prompt("Введите имя вкладки:", tab.customLabel || tab.label);
      if (newName !== null) {
        tab.customLabel = newName || null;
        renderTabs();
        saveSessions();
      }
    }

    function renderTabs() {
      tabBar.innerHTML = "";
      tabs.forEach(t => {
        const btn = document.createElement("div");
        btn.className = `tab ${t.id === activeTabId ? 'active' : ''}`;
        btn.innerHTML = `
          <span class="tab-name">${t.customLabel || t.label}</span>
          <span class="tab-close" title="Закрыть">✕</span>
        `;
        btn.onclick = () => switchTab(t.id);
        btn.ondblclick = (e) => { e.stopPropagation(); renameTab(t.id); };
        btn.querySelector(".tab-close").onclick = (e) => closeTab(t.id, e);
        tabBar.appendChild(btn);
      });

      // New Tab "+" button at the end (like browser tabs)
      const newTabBtn = document.createElement("div");
      newTabBtn.className = "tab new-tab-btn";
      newTabBtn.innerHTML = `+`;
      newTabBtn.title = "Новая вкладка";
      newTabBtn.onclick = () => addTab();
      tabBar.appendChild(newTabBtn);
    }

    function setViewMode(mode) {
      viewMode = mode;
      terminalContainer.className = `terminal-container mode-${mode}`;
      viewTabsBtn.classList.toggle("active", mode === 'tabs');
      viewSplitBtn.classList.toggle("active", mode === 'split');
      if (mode === 'tabs' && activeTabId) switchTab(activeTabId);
      renderSplitLayoutPresets();
      applySplitLayout();
    }

    async function updateTabLabels() {
      for (const tab of tabs) {
        if (tab.type !== "terminal" || !tab.sessionId) continue;
        try {
          const res = await fetch("/api/session/info", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId: tab.sessionId })
          });
          const data = await res.json();
          if (data.ok && data.cwd) {
            const parts = data.cwd.split("/");
            tab.label = parts[parts.length - 1] || "/";
            const labelEl = tab.wrapper.querySelector(".tab-label-text");
            if (labelEl) labelEl.textContent = tab.customLabel || tab.label;
          }
        } catch (e) {}
      }
      renderTabs();
    }

    function setSessionState(tone, message) {
      sessionState.className = `badge ${tone}`;
      sessionState.textContent = message;
    }

    function saveSessions() {
      const data = tabs
        .filter(t => (t.type || "terminal") === "terminal" && t.sessionId)
        .map(t => ({
          type: "terminal",
          sessionId: t.sessionId,
          customLabel: t.customLabel,
          label: t.label
        }));
      sessionStorage.setItem(SESSIONS_STORE_KEY, JSON.stringify(data));
    }

    function loadSessions() {
      try {
        const data = JSON.parse(sessionStorage.getItem(SESSIONS_STORE_KEY));
        if (data && Array.isArray(data) && data.length > 0) {
          data.forEach(s => {
            if ((s.type || "terminal") === "terminal" && s.sessionId) {
              addTab(s.sessionId, s.customLabel || "Terminal");
            }
          });
          if (tabs.length === 0) addTab();
          return;
        }
      } catch (e) {}
      addTab();
    }

    function verifyBootUi() {
      const activeWrapper = terminalContainer.querySelector(".terminal-frame-wrapper.active");
      const activeIframe = activeWrapper?.querySelector("iframe");
      if (!tabs.length || !activeTabId || !activeWrapper || !activeIframe) {
        recoverTerminalUi("пустой экран");
      }
    }

    // Initialize Selects
    fontSizes.forEach(s => {
      const opt = document.createElement("option");
      opt.value = s; opt.textContent = `${s}px`;
      fontSizeSelect.appendChild(opt);
    });
    fontFamilies.forEach(f => {
      const opt = document.createElement("option");
      opt.value = f.value; opt.textContent = f.label;
      fontFamilySelect.appendChild(opt);
    });

    themeButtons.forEach((button) => {
      const theme = themes[button.dataset.theme];
      if (!theme) return;
      const themeName = document.createElement("span");
      themeName.className = "theme-name";
      themeName.textContent = theme.label;
      const themeMode = document.createElement("span");
      themeMode.className = "theme-mode";
      themeMode.textContent = theme.mode === "light" ? "Light" : "Dark";
      button.append(themeName, themeMode);
    });

    fontSizeSelect.value = preferences.fontSize;
    fontFamilySelect.value = preferences.fontFamily;

    // Listeners
    addBrowserBtn.onclick = () => {
      if (!browserConfig.enabled) {
        setStatusText("Browser module disabled", 2200);
        return;
      }
      addBrowserTab();
    };
    directLink.onclick = (event) => {
      event.preventDefault();
      window.open(buildTerminalUrl(createSessionId()), "_blank", "noopener,noreferrer");
      refreshDirectLink();
    };
    directLink.onfocus = refreshDirectLink;
    directLink.onpointerenter = refreshDirectLink;
    reloadActiveBtn.onclick = () => {
      const tab = tabs.find(t => t.id === activeTabId);
      if (tab) {
        const iframe = tab.wrapper.querySelector("iframe");
        iframe.src = tab.type === "browser" ? buildBrowserUrl() : buildTerminalUrl(tab.sessionId);
      }
    };
    viewTabsBtn.onclick = () => setViewMode('tabs');
    viewSplitBtn.onclick = () => setViewMode('split');

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && fullscreenTabId) {
        setFrameFullscreen(fullscreenTabId, false);
      }
    });
    
    fontSizeSelect.onchange = () => { preferences.fontSize = Number(fontSizeSelect.value); savePreferences(); applyAllThemes(); };
    fontFamilySelect.onchange = () => { preferences.fontFamily = fontFamilySelect.value; savePreferences(); applyAllThemes(); };
    themeButtons.forEach(btn => btn.onclick = () => { preferences.theme = btn.dataset.theme; savePreferences(); applyAllThemes(); });
    
    copySelectionBtn.onclick = async () => {
      const tab = tabs.find(t => t.id === activeTabId);
      const iframe = tab?.wrapper.querySelector("iframe");
      try {
        const selection = iframe?.contentWindow?.getSelection()?.toString().trim();
        if (selection) {
          await navigator.clipboard.writeText(selection);
          setStatusText("Скопировано", 2000);
        }
      } catch (e) {
        setStatusText("Копирование доступно через панель remote browser", 2600);
      }
    };

    // Auto-switch on resize
    const resizeObserver = new ResizeObserver(entries => {
      for (let entry of entries) {
        if (entry.contentRect.width < 700 && viewMode === 'split') {
          setViewMode('tabs');
          setStatusText("Авто-переключение во вкладки (узкое окно)", 3000);
        }
      }
    });
    resizeObserver.observe(document.body);

    // Initial load
    applyShellTheme();
    refreshDirectLink();
    loadBrowserConfig().finally(() => {
      loadSessions();
      setTimeout(verifyBootUi, 2000);
    });
    setInterval(updateTabLabels, 10000);

    // Manual panel collapse
    function applyPanelCollapsedPref() {
      const collapsed = !!preferences.panelCollapsed;
      bottomPanel.classList.toggle("collapsed", collapsed);
      togglePanelBtn.classList.toggle("active", collapsed);
      togglePanelBtn.title = collapsed ? "Развернуть панель" : "Свернуть панель";
      togglePanelBtn.setAttribute("aria-expanded", String(!collapsed));
      if (togglePanelLabel) togglePanelLabel.textContent = collapsed ? "Панель" : "Свернуть";
    }

    togglePanelBtn.onclick = () => {
      preferences.panelCollapsed = !preferences.panelCollapsed;
      savePreferences();
      applyPanelCollapsedPref();
    };

    applyPanelCollapsedPref();

    document.addEventListener('click', (e) => {
      document.querySelectorAll('.settings[open]').forEach((details) => {
        if (!details.contains(e.target)) details.removeAttribute('open');
      });
    });
  </script>
</body>
</html>
