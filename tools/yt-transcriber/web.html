<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0d10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="YT Transcript"><title>YT Transcript</title><link rel="apple-touch-icon" href="/yt-transcriber/apple-touch-icon.png?v=7"><style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#0b0d10;color:#edf2f7;font:16px -apple-system,BlinkMacSystemFont,sans-serif}.wrap{width:min(900px,100%);margin:auto;padding:24px 16px 48px}.top,.resulthead,.itemhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:22px}.title{font-size:24px;font-weight:700}.status,.meta{font-size:13px;color:#9eabb8}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f5b942;margin-right:8px}.card{border:1px solid #27313c;background:#11161c;border-radius:18px;padding:16px}.urlrow,.opts{display:grid;grid-template-columns:1fr auto;gap:10px}.opts{grid-template-columns:1fr 1fr;margin-top:10px}.field,select{width:100%;background:#0b0f13;color:#f3f6f8;border:1px solid #303b47;border-radius:12px;padding:14px;font:inherit}.go{border:0;border-radius:12px;background:#ff3030;color:white;font-weight:700;padding:0 20px;min-height:52px}.go:disabled{opacity:.5}.ghost{border:1px solid #303b47;background:#151b22;color:#e5ebf1;border-radius:10px;padding:9px 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.msg{display:none;margin-top:12px;padding:12px;border-radius:10px;background:#281417;color:#ffb9bd}.history{margin-top:25px}.history h2{font-size:19px}.item{border:1px solid #27313c;border-radius:14px;padding:14px;margin:10px 0;background:#11161c}.itemhead{align-items:flex-start}.itemtitle{overflow-wrap:anywhere;font-weight:650}.item .meta{margin-top:6px;line-height:1.5}.item .actions{margin-top:12px}.bar{height:5px;background:#303b47;border-radius:5px;margin-top:10px;overflow:hidden}.bar span{display:block;height:100%;background:#32c97c}.result{display:none;margin-top:20px}.resulthead{margin-bottom:12px;align-items:flex-start}.transcript{max-height:65vh;overflow:auto;border:1px solid #252e38;border-radius:14px;background:#0b0f13}.seg{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:12px 14px;border-bottom:1px solid #1b222b}.time{color:#8592a1;font-size:12px}.text{line-height:1.55;white-space:pre-wrap}.empty{color:#9eabb8}@media(max-width:650px){.wrap{padding-top:16px}.urlrow,.opts{grid-template-columns:1fr}.go{width:100%}.resulthead{flex-direction:column}.transcript{max-height:none}.seg{grid-template-columns:55px 1fr}}
</style></head><body><main class="wrap"><div class="top"><div class="title">YT Transcript</div><div class="status"><span id="dot" class="dot"></span><span id="status">проверка…</span></div></div><section class="card"><div class="urlrow"><input id="url" class="field" type="url" placeholder="Ссылка YouTube" autocomplete="off"><button id="go" class="go">Транскрибировать</button></div><div class="opts"><select id="lang"><option value="auto">Язык: авто</option><option value="ru">Русский</option><option value="en">English</option></select><select id="model"><option value="small">Whisper small</option><option value="base">Whisper base</option><option value="medium">Whisper medium</option></select></div><div id="msg" class="msg" role="alert"></div><section id="result" class="result"><div class="resulthead"><div><strong id="videoTitle"></strong><div id="meta" class="meta"></div></div><div class="actions"><button id="copy" class="ghost">Копировать</button><button id="download" class="ghost">TXT</button><button id="close" class="ghost">Закрыть</button></div></div><div id="transcript" class="transcript"></div></section></section><section class="history"><h2>История обработки</h2><div id="history" class="empty">Загрузка…</div></section></main><script>
const $=id=>document.getElementById(id), BASE=location.pathname.startsWith('/yt-transcriber')?'/yt-transcriber':'';let text='', current=null, busy=false;
function fmt(v){v=Math.max(0,Math.floor(v||0));let h=Math.floor(v/3600),m=Math.floor(v%3600/60),s=v%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,opt){const r=await fetch(BASE+path,{cache:'no-store',...opt});if(r.status===401){location.href='/yt-login';throw Error('Требуется вход')}const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Ошибка запроса');return d}
function error(e){$('msg').textContent=e.message;$('msg').style.display='block'}
async function health(){try{let r=await fetch(BASE+'/health',{cache:'no-store'});$('dot').style.background=r.ok?'#32c97c':'#ff5d5d';$('status').textContent=r.ok?'готов':'недоступен'}catch{$('dot').style.background='#ff5d5d';$('status').textContent='нет связи'}}
async function refresh(){if(busy)return;busy=true;try{const jobs=await api('/api/ui/jobs');$('history').className='';$('history').innerHTML=jobs.length?jobs.map(j=>{const active=j.status==='running'||j.status==='queued';const phase=j.status==='done'?'Готово':j.status==='failed'?'Ошибка':j.stage;const elapsed=fmt(((active?Date.now()/1000:j.updated)-j.created));const progress=typeof j.progress==='number'?` · ${Math.round(j.progress)}%`:'';return `<article class="item"><div class="itemhead"><div class="itemtitle">${esc(j.title||j.url)}</div></div><div class="meta">${esc(phase)}${progress} · ${esc(elapsed)} · ${esc(new Date(j.created*1000).toLocaleString())}</div>${j.error?`<div class="meta">${esc(j.error)}</div>`:''}${active&&typeof j.progress==='number'?`<div class="bar"><span style="width:${Math.max(0,Math.min(100,j.progress))}%"></span></div>`:''}${j.status==='done'?`<div class="actions"><button class="ghost" data-view="${esc(j.id)}">Просмотреть</button><button class="ghost" data-copy="${esc(j.id)}">Копировать</button></div>`:''}</article>`}).join(''):'Пока нет обработанных видео';}catch(e){$('history').textContent='Не удалось загрузить историю: '+e.message}finally{busy=false}}
async function run(){const u=$('url').value.trim();if(!u)return;$('go').disabled=true;$('msg').style.display='none';try{await api('/api/ui/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u,language:$('lang').value,model:$('model').value})});$('url').value='';await refresh()}catch(e){error(e)}finally{$('go').disabled=false}}
async function getResult(id){const job=await api('/api/ui/jobs/'+encodeURIComponent(id));if(!job.result)throw Error('Результат ещё не готов');return job.result}
async function copyText(value){if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);return}const el=document.createElement('textarea');el.value=value;document.body.appendChild(el);el.select();if(!document.execCommand('copy')){el.remove();throw Error('Не удалось скопировать текст')}el.remove()}
async function view(id){let d=await getResult(id);current=d;text=d.text||'';$('videoTitle').textContent=d.title||'Транскрипт';$('meta').textContent=[d.source==='captions'?'Субтитры':'Whisper',d.language,d.duration?fmt(d.duration):''].filter(Boolean).join(' · ');let segs=d.segments||[];$('transcript').innerHTML=segs.length?segs.map(s=>`<div class="seg"><div class="time">${fmt(s.start)}</div><div class="text">${esc(s.text)}</div></div>`).join(''):`<div class="seg"><div></div><div class="text">${esc(text)}</div></div>`;$('result').style.display='block';$('result').scrollIntoView({behavior:'smooth'})}
$('history').onclick=async e=>{let b=e.target.closest('button');if(!b)return;try{if(b.dataset.view)await view(b.dataset.view);if(b.dataset.copy){let d=await getResult(b.dataset.copy);await copyText(d.text||'');b.textContent='Скопировано';setTimeout(()=>b.textContent='Копировать',1800)}}catch(err){error(err)}};$('go').onclick=run;$('url').onkeydown=e=>{if(e.key==='Enter')run()};$('copy').onclick=async()=>{try{await copyText(text);$('copy').textContent='Скопировано';setTimeout(()=>$('copy').textContent='Копировать',1800)}catch(e){error(e)}};$('close').onclick=()=>$('result').style.display='none';$('download').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=(current?.title||'transcript').replace(/[\\/:*?"<>|]/g,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};document.addEventListener('visibilitychange',()=>{if(!document.hidden){health();refresh()}});health();refresh();setInterval(()=>{if(!document.hidden){health();refresh()}},3000);
</script></body></html>
